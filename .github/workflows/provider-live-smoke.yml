name: Provider Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tabitoken-live-smoke:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe Justwoker and AgentRouter compatibility without exposing response content
        id: compatibility_probe
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          bootstrap = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])

          def provider_key(provider_id):
              provider = next((p for p in bootstrap.get("providers", []) if p.get("providerID") == provider_id), None)
              if not provider or not provider.get("keys"):
                  raise SystemExit(f"FAIL: private bootstrap is missing {provider_id}")
              secret = provider["keys"][0].get("secret", "")
              if not secret:
                  raise SystemExit(f"FAIL: private bootstrap has an empty key for {provider_id}")
              return secret

          def auth_headers(secret, mode):
              headers = {"Accept": "application/json", "User-Agent": "CloudCode-iOS-live-smoke/2"}
              if mode in ("bearer", "both"):
                  headers["Authorization"] = f"Bearer {secret}"
              if mode in ("x-api-key", "both"):
                  headers["x-api-key"] = secret
              return headers

          def request(url, secret, mode, payload=None, anthropic=False, extra_headers=None):
              headers = auth_headers(secret, mode)
              if extra_headers:
                  headers.update(extra_headers)
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              if anthropic:
                  headers["anthropic-version"] = "2023-06-01"
              req = urllib.request.Request(url, data=data, headers=headers, method="POST" if payload is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(262144)
                      return response.status, body, response.headers.get("Content-Type", "")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(262144), exc.headers.get("Content-Type", "")

          def capacity_blocked(status, body):
              if status not in (402, 403, 429):
                  return False
              text = body.decode("utf-8", "replace").lower()
              credit_markers = ("预扣费额度失败", "insufficient balance", "insufficient credit", "precharge", "credit exhausted", "balance exhausted")
              capacity_markers = ("account capacity", "capacity exhausted", "quota exhausted")
              return any(marker in text for marker in credit_markers) or (
                  status in (402, 403) and any(marker in text for marker in capacity_markers)
              )

          def client_blocked(status, body):
              if status not in (401, 403):
                  return False
              text = body.decode("utf-8", "replace").lower()
              markers = ("unauthorized_client_error", "unauthorized client detected", "unauthorized_client", "client not allowed", "forbidden client", "not a recognized client")
              return any(marker in text for marker in markers)

          def credential_rejected(status, body):
              if status == 401:
                  return True
              if status != 403:
                  return False
              text = body.decode("utf-8", "replace").lower()
              markers = ("invalid api key", "invalid_api_key", "api key invalid", "authentication failed", "authentication error")
              return any(marker in text for marker in markers)

          agent_key = provider_key("https-agentrouter-org")
          expected_agent_fingerprint = "105a3fce9a105c41472b926f6448a91be2f9726d5e074adbaaa2206f4d6dbf23"
          import hashlib
          agent_fingerprint_matches_catalog = hashlib.sha256(agent_key.encode("utf-8")).hexdigest() == expected_agent_fingerprint
          print(f"AGENTROUTER_SECRET_MATCHES_CATALOG={str(agent_fingerprint_matches_catalog).lower()}")

          agent_origins = (
              ["https://agentrouter.org", "https://co.agentrouter.org"]
              if agent_fingerprint_matches_catalog
              else ["https://co.agentrouter.org", "https://agentrouter.org"]
          )
          agent_client_headers = {
              "User-Agent": "claude-cli/1.0.120 (external, cli)",
              "x-app": "cli",
              "anthropic-beta": "claude-code-20250219",
              "x-stainless-lang": "js",
              "x-stainless-package-version": "0.60.0",
              "x-stainless-runtime": "node",
              "x-stainless-runtime-version": "v22.0.0",
              "x-stainless-os": "Windows",
              "x-stainless-arch": "x64",
          }

          # /v1/models is optional route evidence, not Key readiness. The legacy host can return
          # HTTP 200 non-API content here while direct inference remains the authoritative probe.
          agent_model_ids = []
          catalog_statuses = {}
          for origin in agent_origins:
              models_status, models_body, models_content_type = request(
                  origin + "/v1/models",
                  agent_key,
                  "bearer",
                  extra_headers=agent_client_headers,
              )
              catalog_statuses[origin] = models_status
              origin_models = []
              if 200 <= models_status < 300 and "json" in models_content_type.lower():
                  try:
                      parsed_models = json.loads(models_body.decode("utf-8", "replace"))
                      if isinstance(parsed_models, dict):
                          raw_models = parsed_models.get("data") or parsed_models.get("models") or []
                      else:
                          raw_models = parsed_models
                      if isinstance(raw_models, list):
                          for item in raw_models:
                              if isinstance(item, str):
                                  candidate = item.strip()
                              elif isinstance(item, dict):
                                  candidate = str(item.get("id") or item.get("model") or item.get("name") or "").strip()
                              else:
                                  candidate = ""
                              if candidate and candidate not in origin_models:
                                  origin_models.append(candidate)
                              if candidate and candidate not in agent_model_ids:
                                  agent_model_ids.append(candidate)
                  except Exception:
                      pass
              print(
                  "AGENTROUTER_MODELS "
                  f"origin={origin} status={models_status} content_type={models_content_type.split(';')[0]} "
                  f"model_count={len(origin_models)}"
              )

          agent_payload = {
              "model": "deepseek-v4-flash",
              "max_tokens": 1,
              "stream": False,
              "messages": [{"role": "user", "content": "Reply OK"}],
          }
          agentrouter_client_blocked = False
          agentrouter_compatible = False
          inference_attempts = []
          explicit_auth_rejections = []
          selected_origin = ""
          for origin in agent_origins:
              for protocol, path, anthropic in (
                  ("anthropic", "/v1/messages", True),
                  ("openai_chat", "/v1/chat/completions", False),
              ):
                  status, body, content_type = request(
                      origin + path,
                      agent_key,
                      "bearer",
                      agent_payload,
                      anthropic=anthropic,
                      extra_headers=agent_client_headers,
                  )
                  text = body.decode("utf-8", "replace").lower()
                  media_type = content_type.split(";")[0].strip().lower()
                  stripped = body.lstrip()
                  api_shape = "json" in media_type or stripped.startswith(b"{") or stripped.startswith(b"[") or stripped.startswith(b"data:")
                  model_unavailable = any(marker in text for marker in ("model_not_found", "model not found", "no available channel", "模型不存在", "无可用渠道"))
                  inference_attempts.append((origin, protocol, status))
                  print(
                      "AGENTROUTER_INFERENCE "
                      f"origin={origin} protocol={protocol} status={status} content_type={media_type} "
                      f"api_response={str(api_shape).lower()} body_bytes={len(body)}"
                  )
                  if client_blocked(status, body):
                      agentrouter_client_blocked = True
                      continue
                  if credential_rejected(status, body) and not capacity_blocked(status, body):
                      explicit_auth_rejections.append((origin, protocol, status))
                      continue
                  if (200 <= status < 300 and api_shape) or capacity_blocked(status, body) or model_unavailable:
                      agentrouter_compatible = True
                      selected_origin = origin
                      break
                  if api_shape and (status in (400, 404, 405, 422) or 500 <= status < 600):
                      # API-shaped request/protocol/upstream errors prove the credential reached a
                      # bounded route, but do not claim inference readiness.
                      agentrouter_compatible = True
                      selected_origin = origin
                      break
              if agentrouter_compatible:
                  break

          if agentrouter_compatible:
              print(f"AGENTROUTER_COMPATIBLE_ROUTE={selected_origin}")
          elif agentrouter_client_blocked:
              print(f"::warning::AgentRouter rejected a bounded client route before credential validation: {inference_attempts}. The Key is not classified as stale.")
          else:
              print(f"::warning::AgentRouter produced no accepted direct-inference route: {inference_attempts}; continuing independent provider probes.")

          agentrouter_auth_failed = (
              bool(inference_attempts)
              and not agentrouter_client_blocked
              and len(explicit_auth_rejections) == len(inference_attempts)
          )
          first_models_status = catalog_statuses.get(agent_origins[0], 0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"agentrouter_auth_failed={'true' if agentrouter_auth_failed else 'false'}\n")
              output.write(f"agentrouter_client_blocked={'true' if agentrouter_client_blocked else 'false'}\n")
              output.write(f"agentrouter_secret_matches_catalog={'true' if agent_fingerprint_matches_catalog else 'false'}\n")
              output.write(f"agentrouter_models_status={first_models_status}\n")
              output.write(f"agentrouter_model_count={len(agent_model_ids)}\n")

          just_key = provider_key("https-api-justwoker-icu")
          just_payload = {
              "model": "claude-opus-5",
              "max_tokens": 4,
              "stream": True,
              "messages": [{"role": "user", "content": "Reply OK"}],
          }
          just_statuses = {}
          just_response = None
          just_capacity_blocked = False
          for mode in ("both", "bearer", "x-api-key"):
              status, body, content_type = request(
                  "https://api.justwoker.icu/v1/messages",
                  just_key,
                  mode,
                  just_payload,
                  anthropic=True,
              )
              just_statuses[mode] = status
              print(f"JUSTWOKER_AUTH_PROBE auth={mode} status={status} content_type={content_type.split(';')[0]} body_bytes={len(body)}")
              if 200 <= status < 300:
                  just_response = (mode, status, body, content_type)
                  break
              if capacity_blocked(status, body):
                  just_capacity_blocked = True
                  break
          if just_response is None:
              just_auth_failed = bool(just_statuses) and all(status in (401, 403) for status in just_statuses.values())
              # Compatible gateways can return an empty 403 from a WAF/header path while the
              # single-header paths reach the upstream and return 5xx. Treat any observed 5xx as
              # external gateway/upstream degradation unless every attempted auth mode was an
              # explicit auth rejection; this keeps independent provider probes running.
              just_upstream_unavailable = not just_auth_failed and any(500 <= status < 600 for status in just_statuses.values())
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"justwoker_capacity_blocked={'true' if just_capacity_blocked else 'false'}\n")
                  output.write(f"justwoker_auth_failed={'true' if just_auth_failed else 'false'}\n")
                  output.write(f"justwoker_upstream_unavailable={'true' if just_upstream_unavailable else 'false'}\n")
              if just_capacity_blocked:
                  print("::warning::Justwoker is explicitly blocked by provider credit/capacity; live shape/tool probes are skipped and deterministic Provider regressions will run.")
              elif just_upstream_unavailable:
                  print(f"::warning::Justwoker currently returns only upstream 5xx responses for the minimal probe: {just_statuses}. Other providers and deterministic Provider regressions will still run.")
              elif just_auth_failed:
                  print(f"::warning::Justwoker private-bootstrap key is rejected for all supported auth modes: {just_statuses}. Other providers and deterministic Provider regressions will still run.")
              else:
                  raise SystemExit(f"FAIL: Justwoker Anthropic endpoint rejected all supported auth modes with an unclassified result: {just_statuses}")
          else:
              mode, status, body, content_type = just_response
              text = body.decode("utf-8", "replace")
              stripped = text.lstrip()
              has_data_prefix = "data:" in text
              has_message_stop = '\"message_stop\"' in text
              has_message_delta = '\"message_delta\"' in text
              raw_json = stripped.startswith("{")
              media_type = content_type.split(";")[0].strip().lower()
              print(
                  "JUSTWOKER_STREAM_SHAPE "
                  f"auth={mode} status={status} content_type={media_type} body_bytes={len(body)} "
                  f"has_data_prefix={has_data_prefix} "
                  f"has_message_stop={has_message_stop} "
                  f"has_message_delta={has_message_delta} "
                  f"raw_json={raw_json}"
              )
              if media_type != "text/event-stream" or not has_data_prefix or not has_message_stop or not has_message_delta or raw_json:
                  raise SystemExit("FAIL: Justwoker returned HTTP 2xx but not the expected Anthropic SSE message_delta/message_stop shape")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("justwoker_capacity_blocked=false\n")
                  output.write("justwoker_auth_failed=false\n")
                  output.write("justwoker_upstream_unavailable=false\n")
                  output.write(f"justwoker_auth_mode={mode}\n")

          # Keep a tiny model matrix in the same secure runner so delivery diagnostics can
          # distinguish "this model has no channel" from "the whole Provider is unreachable".
          for model in ("claude-opus-5", "claude-opus-5-thinking"):
              payload = {
                  "model": model,
                  "max_tokens": 1,
                  "stream": False,
                  "messages": [{"role": "user", "content": "OK"}],
              }
              status, body, content_type = request(
                  "https://api.justwoker.icu/v1/messages",
                  just_key,
                  "bearer",
                  payload,
                  anthropic=True,
              )
              text = body.decode("utf-8", "replace").lower()
              model_unavailable = any(marker in text for marker in ("model_not_found", "model not found", "no available channel", "模型不存在", "无可用渠道"))
              print(
                  "JUSTWOKER_MODEL_MATRIX "
                  f"model={model} auth=bearer status={status} content_type={content_type.split(';')[0]} "
                  f"body_bytes={len(body)} model_unavailable={str(model_unavailable).lower()}"
              )

          sir_key = provider_key("https-sirthisway-icu")
          sir_payload = {
              "model": "claude-opus-5",
              "max_tokens": 4,
              "stream": True,
              "messages": [{"role": "user", "content": "Reply OK"}],
          }
          sir_status, sir_body, sir_content_type = request(
              "https://sirthisway.icu/v1/messages",
              sir_key,
              "bearer",
              sir_payload,
              anthropic=True,
          )
          sir_live_available = 200 <= sir_status < 300
          print(
              "SIRTHISWAY_LIVE_PROBE "
              f"status={sir_status} content_type={sir_content_type.split(';')[0]} "
              f"body_bytes={len(sir_body)} available={str(sir_live_available).lower()}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sirthisway_live_available={'true' if sir_live_available else 'false'}\n")
          if not sir_live_available:
              print("::warning::sirthisway.icu did not pass the tiny live inference probe; deterministic Provider regressions remain authoritative for client behavior.")
          PY

      - name: Probe Tabitoken request compatibility without exposing secrets
        id: live_probe
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          bootstrap = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])
          provider = next((p for p in bootstrap.get("providers", []) if p.get("providerID") == "tabitoken"), None)
          if not provider or not provider.get("keys"):
              raise SystemExit("FAIL: Tabitoken key missing from private bootstrap")
          provider_secrets = [entry.get("secret", "").strip() for entry in provider["keys"] if isinstance(entry, dict) and entry.get("secret", "").strip()]
          if not provider_secrets:
              raise SystemExit("FAIL: Tabitoken bootstrap contains no non-empty keys")
          secret = provider_secrets[0]
          base = "https://tabitoken.com/v1"

          def request(label, method, path, payload=None, extra_headers=None, expected=200, allow_billing_block=False, fail_on_mismatch=True, auth_mode="both", absolute_url=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "CloudCode-iOS-live-smoke/1",
              }
              if auth_mode in ("bearer", "both"):
                  headers["Authorization"] = f"Bearer {secret}"
              if auth_mode in ("x-api-key", "both"):
                  headers["x-api-key"] = secret
              if payload is not None:
                  headers["Content-Type"] = "application/json"
              if extra_headers:
                  headers.update(extra_headers)
              req = urllib.request.Request(absolute_url or (base + path), data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(65536).decode("utf-8", "replace")
                      status = response.status
              except urllib.error.HTTPError as exc:
                  body = exc.read(65536).decode("utf-8", "replace")
                  status = exc.code
              body = body.replace(secret, "[REDACTED]")
              compact = " ".join(body.split())[:1200]
              print(f"PROBE {label}: HTTP {status} BODY {compact}")
              if status != expected:
                  billing_blocked = is_billing_block(status, body)
                  if allow_billing_block and billing_blocked:
                      print(f"::warning::{label} is blocked by provider account credit/preauthorization; the workflow will switch to deterministic Provider regressions.")
                      return status, body
                  if fail_on_mismatch:
                      raise SystemExit(f"FAIL: {label} expected HTTP {expected}, got {status}")
              return status, body

          def is_billing_block(status, body):
              if status not in (402, 403, 429):
                  return False
              text = body.lower()
              credit_markers = ("预扣费额度失败", "insufficient balance", "insufficient credit", "precharge", "credit exhausted", "balance exhausted")
              capacity_markers = ("account capacity", "capacity exhausted", "quota exhausted")
              return any(marker in text for marker in credit_markers) or (
                  status in (402, 403) and any(marker in text for marker in capacity_markers)
              )

          def enter_billing_fallback(label, status, body):
              if not is_billing_block(status, body):
                  return False
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("billing_blocked=true\n")
              print(f"::warning::{label} hit explicit provider credit/capacity limits. Live generation probes stop and deterministic Provider regressions will run.")
              raise SystemExit(0)

          def is_model_not_found(status, body):
              if status not in (400, 404, 422, 503):
                  return False
              text = body.lower()
              return any(marker in text for marker in ("model_not_found", "model not found", "unknown model", "模型不存在", "模型未找到"))

          preferred_keys = ("id", "model", "model_id", "modelId", "model_name", "modelName", "name", "slug", "value")

          def parse_model_catalog(models_body):
              try:
                  parsed = json.loads(models_body)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"FAIL: Tabitoken catalog returned malformed JSON: {exc.msg}")

              catalogs = []
              if isinstance(parsed, dict):
                  for catalog_key in ("data", "priced_model_details", "priced_models", "models"):
                      if catalog_key in parsed:
                          catalogs.append((catalog_key, parsed[catalog_key]))
              elif isinstance(parsed, list):
                  catalogs.append(("root", parsed))

              first_catalog = catalogs[0][1] if catalogs else []
              for catalog_key, catalog in catalogs:
                  ids = []

                  def append_candidate(value):
                      if not isinstance(value, str):
                          return
                      value = value.strip()
                      if not value or len(value) > 256 or "\n" in value or "\r" in value or value in ids:
                          return
                      ids.append(value)

                  def extract_candidates(node, allow_scalar=True):
                      if isinstance(node, str):
                          if allow_scalar:
                              append_candidate(node)
                          return
                      if isinstance(node, list):
                          for child in node:
                              extract_candidates(child, True)
                          return
                      if not isinstance(node, dict):
                          return
                      matched = False
                      for key in preferred_keys:
                          if key not in node:
                              continue
                          matched = True
                          child = node[key]
                          if isinstance(child, str):
                              append_candidate(child)
                          else:
                              extract_candidates(child, True)
                      if matched:
                          return
                      model_markers = ("claude", "opus", "sonnet", "haiku", "gpt", "gemini", "deepseek", "glm", "kimi", "qwen", "grok", "minimax", "step")
                      for key, child in node.items():
                          if isinstance(child, (dict, list)) and any(marker in key.lower() for marker in model_markers):
                              append_candidate(key)
                      for child in node.values():
                          if isinstance(child, (dict, list)):
                              extract_candidates(child, False)

                  extract_candidates(catalog)
                  if ids:
                      print(f"TABITOKEN_CATALOG_FIELD={catalog_key}")
                      return ids, catalog

              shape = []
              for catalog_key, catalog in catalogs:
                  if isinstance(catalog, list):
                      first_type = type(catalog[0]).__name__ if catalog else "none"
                      first_keys = sorted(catalog[0].keys())[:32] if catalog and isinstance(catalog[0], dict) else []
                      shape.append({"field": catalog_key, "type": "list", "count": len(catalog), "firstType": first_type, "firstKeys": first_keys})
                  elif isinstance(catalog, dict):
                      sample_keys = sorted(str(key) for key in catalog.keys())[:32]
                      shape.append({"field": catalog_key, "type": "dict", "count": len(catalog), "sampleKeys": sample_keys})
                  else:
                      shape.append({"field": catalog_key, "type": type(catalog).__name__})
              print(f"TABITOKEN_CATALOG_SCHEMA={shape}")
              return [], first_catalog

          pricing_ids = []
          pricing_status, pricing_body = request(
              "public-pricing-models",
              "GET",
              "",
              fail_on_mismatch=False,
              auth_mode="none",
              absolute_url="https://tabitoken.com/api/pricing",
          )
          if pricing_status == 200:
              pricing_ids, _ = parse_model_catalog(pricing_body)
          print(f"TABITOKEN_PUBLIC_PRICING status={pricing_status} model_count={len(pricing_ids)}")

          authenticated_pricing_ids = []
          secret = provider_secrets[0]
          auth_pricing_status, auth_pricing_body = request(
              "authenticated-pricing-key1",
              "GET",
              "",
              fail_on_mismatch=False,
              auth_mode="bearer",
              absolute_url="https://tabitoken.com/api/pricing",
          )
          if auth_pricing_status == 200:
              authenticated_pricing_ids, _ = parse_model_catalog(auth_pricing_body)
          elif auth_pricing_status == 429:
              print("::warning::Authenticated Tabitoken pricing is rate-limited; continuing with /v1/models without treating 429 as credit.")
          elif auth_pricing_status not in (401, 403):
              raise SystemExit(f"FAIL: authenticated Tabitoken pricing returned HTTP {auth_pricing_status}")
          print(f"TABITOKEN_AUTH_PRICING status={auth_pricing_status} model_count={len(authenticated_pricing_ids)}")

          shared_pricing_ids = authenticated_pricing_ids or pricing_ids

          def parse_ratio_catalog(body):
              try:
                  parsed = json.loads(body)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"FAIL: Tabitoken ratio catalog returned malformed JSON: {exc.msg}")
              data = parsed.get("data") if isinstance(parsed, dict) else None
              if not isinstance(data, dict):
                  return []
              ids = []
              for key in ("model_ratio", "model_price", "completion_ratio"):
                  values = data.get(key)
                  if not isinstance(values, dict):
                      continue
                  for model in sorted(values.keys()):
                      if isinstance(model, str) and model and model not in ids:
                          ids.append(model)
              return ids

          ratio_ids = []
          ratio_status, ratio_body = request(
              "authenticated-ratio-models-key1",
              "GET",
              "",
              fail_on_mismatch=False,
              auth_mode="bearer",
              absolute_url="https://tabitoken.com/api/ratio_config",
          )
          if ratio_status == 200:
              ratio_ids = parse_ratio_catalog(ratio_body)
          elif ratio_status == 429:
              print("::warning::Authenticated Tabitoken ratio catalog is rate-limited; continuing without treating 429 as credit.")
          elif ratio_status not in (401, 403, 404):
              raise SystemExit(f"FAIL: Tabitoken ratio catalog returned HTTP {ratio_status}")
          print(f"TABITOKEN_RATIO_CATALOG status={ratio_status} model_count={len(ratio_ids)}")

          dashboard_ids = []
          dashboard_status, dashboard_body = request(
              "authenticated-dashboard-models-key1",
              "GET",
              "",
              fail_on_mismatch=False,
              auth_mode="bearer",
              absolute_url="https://tabitoken.com/api/models",
          )
          if dashboard_status == 200:
              try:
                  dashboard_parsed = json.loads(dashboard_body)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"FAIL: Tabitoken /api/models returned malformed JSON: {exc.msg}")
              dashboard_data = dashboard_parsed.get("data") if isinstance(dashboard_parsed, dict) else None
              if isinstance(dashboard_data, dict):
                  for models in dashboard_data.values():
                      if not isinstance(models, list):
                          continue
                      for model in models:
                          if isinstance(model, str) and model.strip() and model.strip() not in dashboard_ids:
                              dashboard_ids.append(model.strip())
          elif dashboard_status == 429:
              print("::warning::Authenticated Tabitoken /api/models is rate-limited; continuing without treating 429 as credit.")
          elif dashboard_status not in (401, 403, 404):
              raise SystemExit(f"FAIL: Tabitoken /api/models returned HTTP {dashboard_status}")
          print(f"TABITOKEN_DASHBOARD_MODELS status={dashboard_status} model_count={len(dashboard_ids)}")

          shared_catalog_ids = authenticated_pricing_ids or dashboard_ids or ratio_ids or pricing_ids
          shared_catalog_source = (
              "authenticated-pricing" if authenticated_pricing_ids
              else "dashboard-models" if dashboard_ids
              else "ratio-config" if ratio_ids
              else "public-pricing" if pricing_ids
              else None
          )

          selected_model = None
          base_anthropic = None
          anthropic_candidates = []
          selected_key_index = None
          catalog_attempts = []
          saw_model_unavailable = False
          diagnostic_inference_candidates = [
              "claude-opus-5",
              "claude-opus-5-thinking",
              "claude-opus-4-8",
              "claude-opus-4-8-thinking",
          ]

          for key_index, candidate_secret in enumerate(provider_secrets, start=1):
              secret = candidate_secret
              ids = []
              catalog = []
              catalog_auth_mode = None
              catalog_statuses = {}
              for models_auth_mode in ("both",):
                  models_status, models_body = request(
                      f"models-key{key_index}-{models_auth_mode}",
                      "GET",
                      "/models",
                      fail_on_mismatch=False,
                      auth_mode=models_auth_mode,
                  )
                  catalog_statuses[models_auth_mode] = models_status
                  if models_status in (401, 403):
                      continue
                  if models_status == 429:
                      print(f"::warning::Tabitoken /models is rate-limited for key={key_index} auth={models_auth_mode}; using another live source without treating 429 as credit.")
                      break
                  if models_status != 200:
                      raise SystemExit(f"FAIL: Tabitoken /models returned HTTP {models_status} for key={key_index} auth={models_auth_mode}")
                  ids, catalog = parse_model_catalog(models_body)
                  if ids:
                      catalog_auth_mode = models_auth_mode
                      break

              if not ids and shared_catalog_ids:
                  ids = list(shared_catalog_ids)
                  catalog_auth_mode = shared_catalog_source

              catalog_attempts.append({"key": key_index, "statuses": catalog_statuses, "pricingStatus": pricing_status, "authPricingStatus": auth_pricing_status, "ratioStatus": ratio_status, "dashboardStatus": dashboard_status, "modelCount": len(ids)})
              if ids:
                  print(f"TABITOKEN_CATALOG_SOURCE key={key_index} source={catalog_auth_mode} model_count={len(ids)}")
                  named_claude = [model for model in ids if "claude" in model.lower()]
                  other_models = [model for model in ids if model not in named_claude]
                  anthropic_candidates = named_claude + other_models
              else:
                  # Empty catalog remains authoritative as an empty catalog. These known IDs
                  # are diagnostic probe candidates only and become usable only after a real
                  # /messages 2xx. They are never reported as catalog rows merely because
                  # they exist in the desktop snapshot.
                  anthropic_candidates = list(diagnostic_inference_candidates)
                  print(f"TABITOKEN_EMPTY_CATALOG key={key_index}; probing configured candidates live")
              print(f"TABITOKEN_MODEL_CANDIDATE_COUNT key={key_index} count={len(anthropic_candidates)}")

              inference_auth_rejected = False
              for candidate in anthropic_candidates[:32]:
                  probe_payload = {
                      "model": candidate,
                      "max_tokens": 1,
                      "stream": False,
                      "messages": [{"role": "user", "content": "Reply OK"}],
                  }
                  probe_status, probe_body = request(
                      f"anthropic-model-candidate-key{key_index}",
                      "POST",
                      "/messages",
                      probe_payload,
                      {"anthropic-version": "2023-06-01"},
                      allow_billing_block=False,
                      fail_on_mismatch=False,
                  )
                  if 200 <= probe_status < 300:
                      selected_model = candidate
                      base_anthropic = probe_payload
                      selected_key_index = key_index
                      break
                  if is_billing_block(probe_status, probe_body):
                      inference_auth_rejected = True
                      print(f"::warning::Tabitoken key {key_index} has explicit key-scoped credit/capacity exhaustion; rotating to the next configured key instead of marking the whole provider blocked.")
                      break
                  if probe_status in (401, 403):
                      inference_auth_rejected = True
                      print(f"::warning::Tabitoken key {key_index} inference auth returned HTTP {probe_status}; trying the next configured key.")
                      break
                  if is_model_not_found(probe_status, probe_body):
                      saw_model_unavailable = True
                      print(f"TABITOKEN_MODEL_NOT_FOUND key={key_index} status={probe_status}")
                      continue
                  if probe_status not in (400, 404, 422):
                      raise SystemExit(f"FAIL: Tabitoken candidate probe returned non-model HTTP {probe_status} for key={key_index}")

              if selected_model is not None:
                  break
              if inference_auth_rejected:
                  continue

          if not selected_model or base_anthropic is None or selected_key_index is None:
              if saw_model_unavailable:
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("model_unavailable=true\n")
                      output.write("billing_blocked=false\n")
                  print(f"::warning::Tabitoken credentials reached the provider, but no configured Anthropic model currently has an available channel; catalog_attempts={catalog_attempts}")
                  raise SystemExit(0)
              raise SystemExit(f"FAIL: no configured Tabitoken key exposed or live-validated a working Anthropic model; catalog_attempts={catalog_attempts}")
          print(f"TABITOKEN_LIVE_ANTHROPIC_MODEL_VALIDATED=true key={selected_key_index}")

          with_tool = dict(base_anthropic)
          with_tool["tools"] = [{
              "name": "files_read",
              "description": "Read a file",
              "input_schema": {
                  "type": "object",
                  "properties": {"path": {"type": "string"}},
                  "required": ["path"],
                  "additionalProperties": False,
              },
          }]
          tool_status, tool_body = request("anthropic-tool", "POST", "/messages", with_tool, {"anthropic-version": "2023-06-01"}, allow_billing_block=True)
          enter_billing_fallback("anthropic-tool", tool_status, tool_body)

          dotted_tool = dict(base_anthropic)
          dotted_tool["tools"] = [{
              "name": "files.read",
              "description": "Read a file",
              "input_schema": {
                  "type": "object",
                  "properties": {"path": {"type": "string"}},
                  "required": ["path"],
                  "additionalProperties": False,
              },
          }]
          dotted_status, dotted_body = request(
              "anthropic-tool-dotted-name",
              "POST",
              "/messages",
              dotted_tool,
              {"anthropic-version": "2023-06-01"},
              allow_billing_block=True,
              fail_on_mismatch=False,
          )
          enter_billing_fallback("anthropic-tool-dotted-name", dotted_status, dotted_body)
          if dotted_status not in (400, 422):
              raise SystemExit(f"FAIL: dotted Anthropic tool name was not rejected; HTTP {dotted_status}")

          thinking_candidates = [model for model in anthropic_candidates if "thinking" in model.lower()]
          if thinking_candidates:
              thinking_payload = dict(base_anthropic)
              thinking_payload["model"] = thinking_candidates[0]
              thinking_status, thinking_body = request(
                  "anthropic-thinking-minimal",
                  "POST",
                  "/messages",
                  thinking_payload,
                  {"anthropic-version": "2023-06-01"},
                  allow_billing_block=True,
                  fail_on_mismatch=False,
              )
              enter_billing_fallback("anthropic-thinking-minimal", thinking_status, thinking_body)
              if 200 <= thinking_status < 300:
                  large_payload = dict(thinking_payload)
                  large_payload["max_tokens"] = 8192
                  large_status, large_body = request(
                      "anthropic-thinking-max8192",
                      "POST",
                      "/messages",
                      large_payload,
                      {"anthropic-version": "2023-06-01"},
                      allow_billing_block=True,
                      fail_on_mismatch=False,
                  )
                  enter_billing_fallback("anthropic-thinking-max8192", large_status, large_body)
                  if large_status in (400, 404, 422):
                      print("TABITOKEN_THINKING_LARGE_MAX_TOKENS_UNSUPPORTED=true")
                  elif not (200 <= large_status < 300):
                      raise SystemExit(f"FAIL: thinking/large-token probe returned HTTP {large_status}")
              elif thinking_status in (400, 404, 422):
                  print("TABITOKEN_ADVERTISED_THINKING_MODEL_NOT_MESSAGES_COMPATIBLE=true")
              else:
                  raise SystemExit(f"FAIL: thinking model probe returned HTTP {thinking_status}")
          else:
              print("TABITOKEN_THINKING_PROBE_SKIPPED=no-advertised-thinking-model")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"model={selected_model}\n")
              output.write(f"key_index={selected_key_index}\n")
              output.write("billing_blocked=false\n")
              output.write("model_unavailable=false\n")
          PY

      - name: Resolve pinned Swift package
        run: |
          set -euo pipefail
          swift package resolve
          test "$(git -C .build/checkouts/ZIPFoundation rev-parse HEAD)" = "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"

      - name: Run real Cloud Code Agent two-round tool smoke against Justwoker
        if: steps.compatibility_probe.outputs.justwoker_capacity_blocked != 'true' && steps.compatibility_probe.outputs.justwoker_auth_failed != 'true' && steps.compatibility_probe.outputs.justwoker_upstream_unavailable != 'true'
        env:
          CLOUDCODE_JUSTWOKER_LIVE_SMOKE: "1"
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          swift test --filter testJustwokerAgentUsesFullCloudCodeToolSchemaExecutesToolAndContinuesAfterResult

      - name: Run real Cloud Code Agent tool round against sirthisway
        if: steps.compatibility_probe.outputs.sirthisway_live_available == 'true'
        env:
          CLOUDCODE_SIRTHISWAY_LIVE_SMOKE: "1"
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          swift test --filter testSirthiswayAgentUsesFullCloudCodeToolSchemaExecutesToolAndContinuesAfterResult

      - name: Run real Cloud Code Agent tool round against Tabitoken
        if: steps.live_probe.outputs.billing_blocked != 'true' && steps.live_probe.outputs.model_unavailable != 'true'
        env:
          CLOUDCODE_LIVE_SMOKE: "1"
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
          CLOUDCODE_TABITOKEN_LIVE_MODEL: ${{ steps.live_probe.outputs.model }}
          CLOUDCODE_TABITOKEN_LIVE_KEY_INDEX: ${{ steps.live_probe.outputs.key_index }}
        run: |
          set -euo pipefail
          swift test --filter testTabitokenAgentUsesFullCloudCodeToolSchemaExecutesToolAndContinuesAfterResult

      - name: Run deterministic Provider regressions when a live provider is externally blocked
        if: steps.live_probe.outputs.billing_blocked == 'true' || steps.live_probe.outputs.model_unavailable == 'true' || steps.compatibility_probe.outputs.justwoker_capacity_blocked == 'true' || steps.compatibility_probe.outputs.justwoker_auth_failed == 'true' || steps.compatibility_probe.outputs.justwoker_upstream_unavailable == 'true'
        run: |
          set -euo pipefail
          swift test --filter Provider

      - name: Reject private-bootstrap catalog drift
        if: always() && steps.compatibility_probe.outputs.agentrouter_secret_matches_catalog != 'true'
        run: |
          echo 'FAIL: AgentRouter private-bootstrap credential no longer matches the catalog fingerprint. Refresh the private bootstrap/catalog pair before delivery.' >&2
          exit 1

      - name: Report externally rejected optional Provider credentials
        if: always() && (steps.compatibility_probe.outputs.agentrouter_auth_failed == 'true' || steps.compatibility_probe.outputs.justwoker_auth_failed == 'true')
        run: |
          echo '::warning::At least one optional external Provider currently rejects its configured credential. The credential remains isolated to that Provider; deterministic Provider regressions already verified that this state does not invalidate unrelated Providers or the app runtime.'
