name: Provider Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tabitoken-live-smoke:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe Tabitoken request compatibility without exposing secrets
        id: live_probe
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          bootstrap = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])
          provider = next((p for p in bootstrap.get("providers", []) if p.get("providerID") == "tabitoken"), None)
          if not provider or not provider.get("keys"):
              raise SystemExit("FAIL: Tabitoken key missing from private bootstrap")
          secret = provider["keys"][0]["secret"]
          base = "https://tabitoken.com/v1"

          def fall_back_if_billing_blocked(label, status, expected=200):
              if status == expected:
                  return
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("billing_blocked=true\n")
              print(f"::warning::{label} hit provider credit/preauthorization limits. Remaining live-generation probes are skipped; deterministic Provider regressions will run instead.")
              raise SystemExit(0)

          def request(label, method, path, payload=None, extra_headers=None, expected=200, allow_billing_block=False):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {
                  "Accept": "application/json",
                  "Authorization": f"Bearer {secret}",
                  "x-api-key": secret,
                  "User-Agent": "CloudCode-iOS-live-smoke/1",
              }
              if payload is not None:
                  headers["Content-Type"] = "application/json"
              if extra_headers:
                  headers.update(extra_headers)
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(65536).decode("utf-8", "replace")
                      status = response.status
              except urllib.error.HTTPError as exc:
                  body = exc.read(65536).decode("utf-8", "replace")
                  status = exc.code
              body = body.replace(secret, "[REDACTED]")
              compact = " ".join(body.split())[:1200]
              print(f"PROBE {label}: HTTP {status} BODY {compact}")
              if status != expected:
                  billing_blocked = status in (402, 403) and any(marker in body for marker in ("预扣费额度失败", "insufficient balance", "insufficient credit", "precharge"))
                  if allow_billing_block and billing_blocked:
                      print(f"::warning::{label} is blocked by provider account credit/preauthorization; the workflow will switch to deterministic Provider regressions.")
                      return status, body
                  raise SystemExit(f"FAIL: {label} expected HTTP {expected}, got {status}")
              return status, body

          status, models_body = request("models", "GET", "/models")
          if status == 200:
              try:
                  parsed = json.loads(models_body)
                  ids = []
                  if isinstance(parsed, dict):
                      items = parsed.get("data") or parsed.get("models") or []
                      if isinstance(items, list):
                          for item in items:
                              if isinstance(item, dict):
                                  value = item.get("id") or item.get("name")
                              else:
                                  value = item
                              if isinstance(value, str):
                                  ids.append(value)
                  print("TABITOKEN_MODEL_MATCHES:", [m for m in ids if "claude" in m.lower()][:40])
                  required_models = {"claude-opus-5", "claude-opus-5-thinking"}
                  missing = sorted(required_models.difference(ids))
                  if missing:
                      raise SystemExit(f"FAIL: required Tabitoken models missing: {missing}")
              except Exception as exc:
                  print("MODEL_PARSE_NOTE:", type(exc).__name__)

          base_anthropic = {
              "model": "claude-opus-5",
              "max_tokens": 1,
              "stream": False,
              "messages": [{"role": "user", "content": "Reply OK"}],
          }
          minimal_status, _ = request("anthropic-minimal", "POST", "/messages", base_anthropic, {"anthropic-version": "2023-06-01"}, allow_billing_block=True)
          fall_back_if_billing_blocked("anthropic-minimal", minimal_status)

          thinking = dict(base_anthropic)
          thinking["model"] = "claude-opus-5-thinking"
          thinking_status, _ = request("anthropic-thinking-minimal", "POST", "/messages", thinking, {"anthropic-version": "2023-06-01"}, allow_billing_block=True)
          fall_back_if_billing_blocked("anthropic-thinking-minimal", thinking_status)

          large = dict(base_anthropic)
          large["max_tokens"] = 8192
          large_status, _ = request("anthropic-max8192", "POST", "/messages", large, {"anthropic-version": "2023-06-01"}, allow_billing_block=True)
          fall_back_if_billing_blocked("anthropic-max8192", large_status)

          with_tool = dict(base_anthropic)
          with_tool["tools"] = [{
              "name": "files_read",
              "description": "Read a file",
              "input_schema": {
                  "type": "object",
                  "properties": {"path": {"type": "string"}},
                  "required": ["path"],
                  "additionalProperties": False,
              },
          }]
          tool_status, _ = request("anthropic-tool", "POST", "/messages", with_tool, {"anthropic-version": "2023-06-01"}, allow_billing_block=True)
          fall_back_if_billing_blocked("anthropic-tool", tool_status)

          dotted_tool = dict(base_anthropic)
          dotted_tool["tools"] = [{
              "name": "files.read",
              "description": "Read a file",
              "input_schema": {
                  "type": "object",
                  "properties": {"path": {"type": "string"}},
                  "required": ["path"],
                  "additionalProperties": False,
              },
          }]
          dotted_status, _ = request("anthropic-tool-dotted-name", "POST", "/messages", dotted_tool, {"anthropic-version": "2023-06-01"}, expected=400, allow_billing_block=True)
          fall_back_if_billing_blocked("anthropic-tool-dotted-name", dotted_status, expected=400)

          openai_minimal_status, _ = request("openai-chat-minimal", "POST", "/chat/completions", {
              "model": "claude-opus-5",
              "max_tokens": 1,
              "stream": False,
              "messages": [{"role": "user", "content": "Reply OK"}],
          }, allow_billing_block=True)
          fall_back_if_billing_blocked("openai-chat-minimal", openai_minimal_status)

          openai_tool_status, _ = request("openai-chat-tool", "POST", "/chat/completions", {
              "model": "claude-opus-5",
              "max_tokens": 1,
              "stream": False,
              "messages": [{"role": "user", "content": "Reply OK"}],
              "tools": [{
                  "type": "function",
                  "function": {
                      "name": "files_read",
                      "description": "Read a file",
                      "parameters": {
                          "type": "object",
                          "properties": {"path": {"type": "string"}},
                          "required": ["path"],
                          "additionalProperties": False,
                      },
                  },
              }],
          }, allow_billing_block=True)
          fall_back_if_billing_blocked("openai-chat-tool", openai_tool_status)

          openai_dotted_status, _ = request("openai-chat-tool-dotted-name", "POST", "/chat/completions", {
              "model": "claude-opus-5",
              "max_tokens": 1,
              "stream": False,
              "messages": [{"role": "user", "content": "Reply OK"}],
              "tools": [{
                  "type": "function",
                  "function": {
                      "name": "files.read",
                      "description": "Read a file",
                      "parameters": {
                          "type": "object",
                          "properties": {"path": {"type": "string"}},
                          "required": ["path"],
                          "additionalProperties": False,
                      },
                  },
              }],
          }, expected=400, allow_billing_block=True)
          fall_back_if_billing_blocked("openai-chat-tool-dotted-name", openai_dotted_status, expected=400)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("billing_blocked=false\n")
          PY

      - name: Resolve pinned Swift package
        run: |
          set -euo pipefail
          swift package resolve
          test "$(git -C .build/checkouts/ZIPFoundation rev-parse HEAD)" = "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"

      - name: Run real Cloud Code Agent tool round against Tabitoken
        if: steps.live_probe.outputs.billing_blocked != 'true'
        env:
          CLOUDCODE_LIVE_SMOKE: "1"
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          swift test --filter ProviderLiveIntegrationTests

      - name: Run deterministic Provider regressions when account credit blocks live generation
        if: steps.live_probe.outputs.billing_blocked == 'true'
        run: |
          set -euo pipefail
          swift test --filter Provider
