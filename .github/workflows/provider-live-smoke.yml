name: Provider Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tabitoken-live-smoke:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe Justwoker and AgentRouter compatibility without exposing response content
        id: compatibility_probe
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          bootstrap = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])

          def provider_key(provider_id):
              provider = next((p for p in bootstrap.get("providers", []) if p.get("providerID") == provider_id), None)
              if not provider or not provider.get("keys"):
                  raise SystemExit(f"FAIL: private bootstrap is missing {provider_id}")
              secret = provider["keys"][0].get("secret", "")
              if not secret:
                  raise SystemExit(f"FAIL: private bootstrap has an empty key for {provider_id}")
              return secret

          def auth_headers(secret, mode):
              headers = {"Accept": "application/json", "User-Agent": "CloudCode-iOS-live-smoke/2"}
              if mode in ("bearer", "both"):
                  headers["Authorization"] = f"Bearer {secret}"
              if mode in ("x-api-key", "both"):
                  headers["x-api-key"] = secret
              return headers

          def request(url, secret, mode, payload=None, anthropic=False):
              headers = auth_headers(secret, mode)
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              if anthropic:
                  headers["anthropic-version"] = "2023-06-01"
              req = urllib.request.Request(url, data=data, headers=headers, method="POST" if payload is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(262144)
                      return response.status, body, response.headers.get("Content-Type", "")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(262144), exc.headers.get("Content-Type", "")

          def capacity_blocked(status, body):
              if status not in (402, 403, 429):
                  return False
              text = body.decode("utf-8", "replace").lower()
              return any(marker in text for marker in ("预扣费额度失败", "insufficient balance", "insufficient credit", "precharge", "quota", "capacity"))

          agent_key = provider_key("https-agentrouter-org")
          agent_payload = {
              "model": "deepseek-v4-flash",
              "max_tokens": 1,
              "stream": False,
              "messages": [{"role": "user", "content": "Reply OK"}],
          }
          agent_statuses = {}
          for mode in ("both", "bearer", "x-api-key"):
              status, body, content_type = request(
                  "https://co.agentrouter.org/v1/chat/completions",
                  agent_key,
                  mode,
                  agent_payload,
              )
              agent_statuses[mode] = status
              print(f"AGENTROUTER_CHAT auth={mode} status={status} content_type={content_type.split(';')[0]} body_bytes={len(body)}")
              if 200 <= status < 300 or capacity_blocked(status, body):
                  print(f"AGENTROUTER_COMPATIBLE_AUTH={mode}")
                  break
          else:
              print(f"::warning::AgentRouter private-bootstrap key was rejected for all supported auth modes: {agent_statuses}. This indicates stale/rotated credentials rather than an endpoint-shape failure; continuing other provider compatibility probes.")

          just_key = provider_key("https-api-justwoker-icu")
          just_payload = {
              "model": "claude-opus-5",
              "max_tokens": 4,
              "stream": True,
              "messages": [{"role": "user", "content": "Reply OK"}],
          }
          just_statuses = {}
          just_response = None
          just_capacity_blocked = False
          for mode in ("both", "bearer", "x-api-key"):
              status, body, content_type = request(
                  "https://api.justwoker.icu/v1/messages",
                  just_key,
                  mode,
                  just_payload,
                  anthropic=True,
              )
              just_statuses[mode] = status
              print(f"JUSTWOKER_AUTH_PROBE auth={mode} status={status} content_type={content_type.split(';')[0]} body_bytes={len(body)}")
              if 200 <= status < 300:
                  just_response = (mode, status, body, content_type)
                  break
              if capacity_blocked(status, body):
                  just_capacity_blocked = True
                  break
          if just_response is None:
              if just_capacity_blocked:
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("justwoker_capacity_blocked=true\n")
                  print("::warning::Justwoker is explicitly blocked by provider credit/capacity; live shape/tool probes are skipped and deterministic Provider regressions will run.")
              else:
                  raise SystemExit(f"FAIL: Justwoker Anthropic endpoint rejected all supported auth modes: {just_statuses}")
          else:
              mode, status, body, content_type = just_response
              text = body.decode("utf-8", "replace")
              stripped = text.lstrip()
              has_data_prefix = "data:" in text
              has_message_stop = '\"message_stop\"' in text
              has_message_delta = '\"message_delta\"' in text
              raw_json = stripped.startswith("{")
              media_type = content_type.split(";")[0].strip().lower()
              print(
                  "JUSTWOKER_STREAM_SHAPE "
                  f"auth={mode} status={status} content_type={media_type} body_bytes={len(body)} "
                  f"has_data_prefix={has_data_prefix} "
                  f"has_message_stop={has_message_stop} "
                  f"has_message_delta={has_message_delta} "
                  f"raw_json={raw_json}"
              )
              if media_type != "text/event-stream" or not has_data_prefix or not has_message_stop or not has_message_delta or raw_json:
                  raise SystemExit("FAIL: Justwoker returned HTTP 2xx but not the expected Anthropic SSE message_delta/message_stop shape")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("justwoker_capacity_blocked=false\n")
                  output.write(f"justwoker_auth_mode={mode}\n")
          PY

      - name: Probe Tabitoken request compatibility without exposing secrets
        id: live_probe
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          bootstrap = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])
          provider = next((p for p in bootstrap.get("providers", []) if p.get("providerID") == "tabitoken"), None)
          if not provider or not provider.get("keys"):
              raise SystemExit("FAIL: Tabitoken key missing from private bootstrap")
          provider_secrets = [entry.get("secret", "").strip() for entry in provider["keys"] if isinstance(entry, dict) and entry.get("secret", "").strip()]
          if not provider_secrets:
              raise SystemExit("FAIL: Tabitoken bootstrap contains no non-empty keys")
          secret = provider_secrets[0]
          base = "https://tabitoken.com/v1"

          def request(label, method, path, payload=None, extra_headers=None, expected=200, allow_billing_block=False, fail_on_mismatch=True, auth_mode="both"):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "CloudCode-iOS-live-smoke/1",
              }
              if auth_mode in ("bearer", "both"):
                  headers["Authorization"] = f"Bearer {secret}"
              if auth_mode in ("x-api-key", "both"):
                  headers["x-api-key"] = secret
              if payload is not None:
                  headers["Content-Type"] = "application/json"
              if extra_headers:
                  headers.update(extra_headers)
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(65536).decode("utf-8", "replace")
                      status = response.status
              except urllib.error.HTTPError as exc:
                  body = exc.read(65536).decode("utf-8", "replace")
                  status = exc.code
              body = body.replace(secret, "[REDACTED]")
              compact = " ".join(body.split())[:1200]
              print(f"PROBE {label}: HTTP {status} BODY {compact}")
              if status != expected:
                  billing_blocked = status in (402, 403, 429) and any(marker in body.lower() for marker in ("预扣费额度失败", "insufficient balance", "insufficient credit", "precharge", "quota", "capacity"))
                  if allow_billing_block and billing_blocked:
                      print(f"::warning::{label} is blocked by provider account credit/preauthorization; the workflow will switch to deterministic Provider regressions.")
                      return status, body
                  if fail_on_mismatch:
                      raise SystemExit(f"FAIL: {label} expected HTTP {expected}, got {status}")
              return status, body

          def is_billing_block(status, body):
              return status in (402, 403, 429) and any(
                  marker in body.lower()
                  for marker in ("预扣费额度失败", "insufficient balance", "insufficient credit", "precharge", "quota", "capacity")
              )

          def enter_billing_fallback(label, status, body):
              if not is_billing_block(status, body):
                  return False
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("billing_blocked=true\n")
              print(f"::warning::{label} hit explicit provider credit/capacity limits. Live generation probes stop and deterministic Provider regressions will run.")
              raise SystemExit(0)

          preferred_keys = ("id", "model", "model_id", "modelId", "model_name", "modelName", "name", "slug", "value")

          def parse_model_catalog(models_body):
              try:
                  parsed = json.loads(models_body)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"FAIL: Tabitoken /models returned malformed JSON: {exc.msg}")
              catalog = (parsed.get("data") or parsed.get("models") or []) if isinstance(parsed, dict) else []
              ids = []

              def append_candidate(value):
                  if not isinstance(value, str):
                      return
                  value = value.strip()
                  if not value or len(value) > 256 or "\n" in value or "\r" in value or value in ids:
                      return
                  ids.append(value)

              def extract_candidates(node, allow_scalar=True):
                  if isinstance(node, str):
                      if allow_scalar:
                          append_candidate(node)
                      return
                  if isinstance(node, list):
                      for child in node:
                          extract_candidates(child, True)
                      return
                  if not isinstance(node, dict):
                      return
                  matched = False
                  for key in preferred_keys:
                      if key not in node:
                          continue
                      matched = True
                      child = node[key]
                      if isinstance(child, str):
                          append_candidate(child)
                      else:
                          extract_candidates(child, True)
                  if matched:
                      return
                  for child in node.values():
                      if isinstance(child, (dict, list)):
                          extract_candidates(child, False)

              extract_candidates(catalog)
              return ids, catalog

          selected_model = None
          base_anthropic = None
          anthropic_candidates = []
          selected_key_index = None
          catalog_attempts = []

          for key_index, candidate_secret in enumerate(provider_secrets, start=1):
              secret = candidate_secret
              ids = []
              catalog = []
              catalog_auth_mode = None
              catalog_statuses = {}
              for models_auth_mode in ("both", "bearer", "x-api-key"):
                  models_status, models_body = request(
                      f"models-key{key_index}-{models_auth_mode}",
                      "GET",
                      "/models",
                      fail_on_mismatch=False,
                      auth_mode=models_auth_mode,
                  )
                  catalog_statuses[models_auth_mode] = models_status
                  if models_status in (401, 403):
                      continue
                  if models_status != 200:
                      raise SystemExit(f"FAIL: Tabitoken /models returned HTTP {models_status} for key={key_index} auth={models_auth_mode}")
                  ids, catalog = parse_model_catalog(models_body)
                  if ids:
                      catalog_auth_mode = models_auth_mode
                      break

              catalog_attempts.append({"key": key_index, "statuses": catalog_statuses, "modelCount": len(ids)})
              if not ids:
                  continue

              print(f"TABITOKEN_CATALOG_AUTH key={key_index} auth={catalog_auth_mode} model_count={len(ids)}")
              named_claude = [model for model in ids if "claude" in model.lower()]
              other_models = [model for model in ids if model not in named_claude]
              anthropic_candidates = named_claude + other_models
              print(f"TABITOKEN_MODEL_CANDIDATE_COUNT key={key_index} count={len(anthropic_candidates)}")

              inference_auth_rejected = False
              for candidate in anthropic_candidates[:32]:
                  probe_payload = {
                      "model": candidate,
                      "max_tokens": 1,
                      "stream": False,
                      "messages": [{"role": "user", "content": "Reply OK"}],
                  }
                  probe_status, probe_body = request(
                      f"anthropic-model-candidate-key{key_index}",
                      "POST",
                      "/messages",
                      probe_payload,
                      {"anthropic-version": "2023-06-01"},
                      allow_billing_block=True,
                      fail_on_mismatch=False,
                  )
                  enter_billing_fallback(f"anthropic-model-candidate-key{key_index}", probe_status, probe_body)
                  if 200 <= probe_status < 300:
                      selected_model = candidate
                      base_anthropic = probe_payload
                      selected_key_index = key_index
                      break
                  if probe_status in (401, 403):
                      inference_auth_rejected = True
                      print(f"::warning::Tabitoken key {key_index} catalog was readable but inference auth returned HTTP {probe_status}; trying the next configured key.")
                      break
                  if probe_status not in (400, 404, 422):
                      raise SystemExit(f"FAIL: Tabitoken candidate probe returned non-model HTTP {probe_status} for key={key_index}")

              if selected_model is not None:
                  break
              if inference_auth_rejected:
                  continue

          if not selected_model or base_anthropic is None or selected_key_index is None:
              raise SystemExit(f"FAIL: no configured Tabitoken key exposed a non-empty catalog plus a working Anthropic model; catalog_attempts={catalog_attempts}")
          print(f"TABITOKEN_DYNAMIC_ANTHROPIC_MODEL_VALIDATED=true key={selected_key_index}")

          with_tool = dict(base_anthropic)
          with_tool["tools"] = [{
              "name": "files_read",
              "description": "Read a file",
              "input_schema": {
                  "type": "object",
                  "properties": {"path": {"type": "string"}},
                  "required": ["path"],
                  "additionalProperties": False,
              },
          }]
          tool_status, tool_body = request("anthropic-tool", "POST", "/messages", with_tool, {"anthropic-version": "2023-06-01"}, allow_billing_block=True)
          enter_billing_fallback("anthropic-tool", tool_status, tool_body)

          dotted_tool = dict(base_anthropic)
          dotted_tool["tools"] = [{
              "name": "files.read",
              "description": "Read a file",
              "input_schema": {
                  "type": "object",
                  "properties": {"path": {"type": "string"}},
                  "required": ["path"],
                  "additionalProperties": False,
              },
          }]
          dotted_status, dotted_body = request(
              "anthropic-tool-dotted-name",
              "POST",
              "/messages",
              dotted_tool,
              {"anthropic-version": "2023-06-01"},
              allow_billing_block=True,
              fail_on_mismatch=False,
          )
          enter_billing_fallback("anthropic-tool-dotted-name", dotted_status, dotted_body)
          if dotted_status not in (400, 422):
              raise SystemExit(f"FAIL: dotted Anthropic tool name was not rejected; HTTP {dotted_status}")

          thinking_candidates = [model for model in anthropic_candidates if "thinking" in model.lower()]
          if thinking_candidates:
              thinking_payload = dict(base_anthropic)
              thinking_payload["model"] = thinking_candidates[0]
              thinking_status, thinking_body = request(
                  "anthropic-thinking-minimal",
                  "POST",
                  "/messages",
                  thinking_payload,
                  {"anthropic-version": "2023-06-01"},
                  allow_billing_block=True,
                  fail_on_mismatch=False,
              )
              enter_billing_fallback("anthropic-thinking-minimal", thinking_status, thinking_body)
              if 200 <= thinking_status < 300:
                  large_payload = dict(thinking_payload)
                  large_payload["max_tokens"] = 8192
                  large_status, large_body = request(
                      "anthropic-thinking-max8192",
                      "POST",
                      "/messages",
                      large_payload,
                      {"anthropic-version": "2023-06-01"},
                      allow_billing_block=True,
                      fail_on_mismatch=False,
                  )
                  enter_billing_fallback("anthropic-thinking-max8192", large_status, large_body)
                  if large_status in (400, 404, 422):
                      print("TABITOKEN_THINKING_LARGE_MAX_TOKENS_UNSUPPORTED=true")
                  elif not (200 <= large_status < 300):
                      raise SystemExit(f"FAIL: thinking/large-token probe returned HTTP {large_status}")
              elif thinking_status in (400, 404, 422):
                  print("TABITOKEN_ADVERTISED_THINKING_MODEL_NOT_MESSAGES_COMPATIBLE=true")
              else:
                  raise SystemExit(f"FAIL: thinking model probe returned HTTP {thinking_status}")
          else:
              print("TABITOKEN_THINKING_PROBE_SKIPPED=no-advertised-thinking-model")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"model={selected_model}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("billing_blocked=false\n")
          PY

      - name: Resolve pinned Swift package
        run: |
          set -euo pipefail
          swift package resolve
          test "$(git -C .build/checkouts/ZIPFoundation rev-parse HEAD)" = "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"

      - name: Run real Cloud Code Agent two-round tool smoke against Justwoker
        if: steps.compatibility_probe.outputs.justwoker_capacity_blocked != 'true'
        env:
          CLOUDCODE_JUSTWOKER_LIVE_SMOKE: "1"
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          swift test --filter testJustwokerAgentUsesFullCloudCodeToolSchemaExecutesToolAndContinuesAfterResult

      - name: Run real Cloud Code Agent tool round against Tabitoken
        if: steps.live_probe.outputs.billing_blocked != 'true'
        env:
          CLOUDCODE_LIVE_SMOKE: "1"
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
          CLOUDCODE_TABITOKEN_LIVE_MODEL: ${{ steps.live_probe.outputs.model }}
        run: |
          set -euo pipefail
          swift test --filter testTabitokenAgentUsesFullCloudCodeToolSchemaExecutesToolAndContinuesAfterResult

      - name: Run deterministic Provider regressions when account credit blocks live generation
        if: steps.live_probe.outputs.billing_blocked == 'true' || steps.compatibility_probe.outputs.justwoker_capacity_blocked == 'true'
        run: |
          set -euo pipefail
          swift test --filter Provider
