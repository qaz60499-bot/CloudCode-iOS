name: ChatGPT WebCompat Build 5

on:
  push:
    branches:
      - webcompat-build5-20260914
    paths:
      - 'Standalone/ChatGPTWebCompat/**'
      - '.github/workflows/webcompat-build5.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Generate project
        working-directory: Standalone/ChatGPTWebCompat
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: Standalone/ChatGPTWebCompat
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project ChatGPTWebCompat.xcodeproj \
            -scheme ChatGPTWebCompat \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        working-directory: Standalone/ChatGPTWebCompat
        run: |
          set -euo pipefail
          APP='build/DerivedData/Build/Products/Release-iphoneos/ChatGPTWebCompat.app'
          test -d "$APP"
          rm -rf build/Payload build/ChatGPT-Web-Compat-iOS16-v1.0.4-build5.ipa
          mkdir -p build/Payload
          ditto "$APP" build/Payload/ChatGPTWebCompat.app
          cd build
          /usr/bin/zip -qry ChatGPT-Web-Compat-iOS16-v1.0.4-build5.ipa Payload
          /usr/bin/shasum -a 256 ChatGPT-Web-Compat-iOS16-v1.0.4-build5.ipa > ChatGPT-Web-Compat-iOS16-v1.0.4-build5.ipa.sha256

      - name: Verify metadata
        working-directory: Standalone/ChatGPTWebCompat
        run: |
          set -euo pipefail
          APP='build/DerivedData/Build/Products/Release-iphoneos/ChatGPTWebCompat.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'com.cloudcode.chatgptwebcompat'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = '1.0.4'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '5'
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = '16.6'
          /usr/bin/file "$APP/ChatGPTWebCompat"
          /usr/bin/otool -l "$APP/ChatGPTWebCompat" | grep -A5 LC_BUILD_VERSION

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Web-Compat-iOS16-v1.0.4-build5
          path: |
            Standalone/ChatGPTWebCompat/build/ChatGPT-Web-Compat-iOS16-v1.0.4-build5.ipa
            Standalone/ChatGPTWebCompat/build/ChatGPT-Web-Compat-iOS16-v1.0.4-build5.ipa.sha256
          if-no-files-found: error
          retention-days: 14
