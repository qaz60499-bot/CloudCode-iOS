name: Private TrollStore Privileged Validation IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudcode-ios-private-trollstore-privileged-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-private-trollstore-privileged-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require successful release-launch CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-ci.yml --commit "$GITHUB_SHA" --status completed --limit 10 --json conclusion,headSha,databaseId)"
          python3 - "$GITHUB_SHA" "$RUNS_JSON" <<'PY'
          import json
          import sys
          head = sys.argv[1]
          runs = json.loads(sys.argv[2])
          if not any(run.get("headSha") == head and run.get("conclusion") == "success" for run in runs):
              raise SystemExit("FAIL: privileged IPA cannot be produced until iOS CI and IPA succeeds for this exact commit")
          print("PASS: exact commit already passed release-simulator cold-launch/relaunch CI")
          PY

      - name: Validate required secrets
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
          CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD: ${{ secrets.CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CLOUDCODE_PROVIDER_BOOTSTRAP"
          test -n "$CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD"
          python3 - <<'PY'
          import json
          import os
          payload = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])
          assert payload.get("schemaVersion") == 1
          assert payload.get("providers")
          print("Required private build secrets are present and structurally valid; secret values were not printed.")
          PY

      - name: Install pinned tool versions
        run: |
          set -euo pipefail
          brew install xcodegen ldid-procursus
          xcodegen --version | grep -F '2.46.0'
          brew list --versions ldid-procursus | grep -F '2.1.5-procursus7'

      - name: Resolve and test core package
        run: |
          set -euo pipefail
          swift package resolve
          test "$(git -C .build/checkouts/ZIPFoundation rev-parse HEAD)" = "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"
          swift test --parallel

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          rm -rf build/PrivilegedDerivedData build/privileged-private-ipa
          xcodebuild \
            -project CloudCodeIOS.xcodeproj \
            -scheme CloudCodeIOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/PrivilegedDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Embed private Provider bootstrap
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          APP_PATH="build/PrivilegedDerivedData/Build/Products/Release-iphoneos/CloudCode.app"
          test -d "$APP_PATH"
          python3 - "$APP_PATH/CloudCode-Provider-Bootstrap.json" <<'PY'
          import json
          import os
          import pathlib
          import sys
          target = pathlib.Path(sys.argv[1])
          payload = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Private Provider bootstrap embedded; secret values were not printed.")
          PY

      - name: Sign privileged TrollStore validation build
        run: |
          set -euo pipefail
          APP_PATH="build/PrivilegedDerivedData/Build/Products/Release-iphoneos/CloudCode.app"
          while IFS= read -r dylib; do
            ldid -S "$dylib"
          done < <(find "$APP_PATH" -type f -name '*.dylib' -print)
          while IFS= read -r framework; do
            framework_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$framework/Info.plist")"
            test -f "$framework/$framework_name"
            ldid -S "$framework/$framework_name"
          done < <(find "$APP_PATH" -type d -name '*.framework' -print)
          MAIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          ROOT_HELPER="$APP_PATH/CloudCodeRootHelper"
          test -f "$ROOT_HELPER"
          ldid -SEntitlements/CloudCodeRootHelper.entitlements "$ROOT_HELPER"
          ldid -SEntitlements/TrollStore.entitlements "$APP_PATH/$MAIN_EXECUTABLE"
          ENTITLEMENTS="$RUNNER_TEMP/cloudcode-privileged-entitlements.plist"
          ldid -e "$APP_PATH/$MAIN_EXECUTABLE" > "$ENTITLEMENTS"
          plutil -lint "$ENTITLEMENTS" >/dev/null
          for required_host_entitlement in \
            com.apple.private.security.no-sandbox \
            platform-application \
            com.apple.private.security.storage.AppDataContainers \
            com.apple.private.persona-mgmt; do
            /usr/libexec/PlistBuddy -c "Print :$required_host_entitlement" "$ENTITLEMENTS" | grep -F 'true'
          done
          rm -f "$ENTITLEMENTS"
          HELPER_ENTITLEMENTS="$RUNNER_TEMP/cloudcode-root-helper-entitlements.plist"
          ldid -e "$ROOT_HELPER" > "$HELPER_ENTITLEMENTS"
          plutil -lint "$HELPER_ENTITLEMENTS" >/dev/null
          for required_helper_entitlement in \
            com.apple.private.security.no-sandbox \
            platform-application \
            com.apple.private.persona-mgmt \
            com.apple.multitasking.unlimitedassertions \
            com.apple.hid.system.server-access \
            com.apple.private.hid.client.event-dispatch \
            com.apple.private.hid.client.event-filter \
            com.apple.private.hid.client.event-monitor \
            com.apple.private.hid.client.service-protected \
            com.apple.private.hid.manager.client \
            com.apple.accessibility.api \
            com.apple.QuartzCore.displayable-context \
            com.apple.QuartzCore.global-capture \
            com.apple.QuartzCore.secure-capture \
            com.apple.QuartzCore.secure-mode \
            com.apple.QuartzCore.system-layers \
            com.apple.private.IOSurface.protected-access \
            com.apple.backboard.client; do
            /usr/libexec/PlistBuddy -c "Print :$required_helper_entitlement" "$HELPER_ENTITLEMENTS" | grep -F 'true'
          done
          for required_helper_iokit_class in \
            IOHIDEventServiceFastPathUserClient \
            IOHIDLibUserClient; do
            for iokit_entitlement in \
              com.apple.security.iokit-user-client-class \
              com.apple.security.exception.iokit-user-client-class; do
              /usr/libexec/PlistBuddy -c "Print :$iokit_entitlement" "$HELPER_ENTITLEMENTS" | grep -F "$required_helper_iokit_class"
            done
          done
          rm -f "$HELPER_ENTITLEMENTS"
          echo 'PASS: privileged host + isolated GUI helper entitlement sets embedded'

      - name: Package privileged private TrollStore IPA
        run: |
          set -euo pipefail
          APP_PATH="build/PrivilegedDerivedData/Build/Products/Release-iphoneos/CloudCode.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          mkdir -p build/privileged-private-ipa/Payload
          cp -R "$APP_PATH" build/privileged-private-ipa/Payload/
          (cd build/privileged-private-ipa && zip -qry "../CloudCode-iOS-TrollStore-PRIVILEGED-${VERSION}-build${BUILD}.ipa" Payload)
          printf '%s' "$VERSION" > "$RUNNER_TEMP/cloudcode-version.txt"
          printf '%s' "$BUILD" > "$RUNNER_TEMP/cloudcode-build.txt"

      - name: Verify privileged IPA and secret isolation
        run: |
          set -euo pipefail
          VERSION="$(cat "$RUNNER_TEMP/cloudcode-version.txt")"
          BUILD="$(cat "$RUNNER_TEMP/cloudcode-build.txt")"
          IPA="build/CloudCode-iOS-TrollStore-PRIVILEGED-${VERSION}-build${BUILD}.ipa"
          bash scripts/verify_privileged_private_ipa.sh "$IPA"
          if find . -path './.git' -prune -o -type f \( -name '*.ipa' -o -name '*Provider-Bootstrap*.json' \) -print | grep -vE '^\./build/' | grep -q .; then
            echo "FAIL: private build material escaped the build directory" >&2
            exit 1
          fi
          if grep -R -E --line-number 'sk-[A-Za-z0-9]{20,}' Sources Tests docs scripts .github; then
            echo "FAIL: API-Key-shaped material found in tracked files" >&2
            exit 1
          fi
          if grep -R -E --line-number 'uses: [^#]+@(v[0-9]+|main|master)([[:space:]]|$)' .github/workflows; then
            echo "FAIL: GitHub Action is not pinned to an immutable commit SHA" >&2
            exit 1
          fi

      - name: Encrypt privileged private IPA before artifact upload
        env:
          CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD: ${{ secrets.CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(cat "$RUNNER_TEMP/cloudcode-version.txt")"
          BUILD="$(cat "$RUNNER_TEMP/cloudcode-build.txt")"
          IPA="build/CloudCode-iOS-TrollStore-PRIVILEGED-${VERSION}-build${BUILD}.ipa"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$IPA" \
            -out "${IPA}.enc" \
            -pass env:CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD
          rm -rf build/privileged-private-ipa "$IPA" build/PrivilegedDerivedData
          test -s "${IPA}.enc"
          test ! -e "$IPA"

      - name: Upload encrypted privileged IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CloudCode-iOS-TrollStore-PRIVILEGED-private-encrypted
          path: build/CloudCode-iOS-TrollStore-PRIVILEGED-*.ipa.enc
          if-no-files-found: error
          retention-days: 1
