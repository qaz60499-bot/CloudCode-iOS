name: Private TrollStore Stable IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcode-ios-private-trollstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-private-trollstore-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required secrets
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
          CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD: ${{ secrets.CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CLOUDCODE_PROVIDER_BOOTSTRAP"
          test -n "$CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD"
          python3 - <<'PY'
          import json
          import os
          payload = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])
          assert payload.get("schemaVersion") == 1
          assert payload.get("providers")
          print("Required private build secrets are present and structurally valid; secret values were not printed.")
          PY

      - name: Install pinned tool versions
        run: |
          set -euo pipefail
          brew install xcodegen ldid-procursus
          xcodegen --version | grep -F '2.46.0'
          brew list --versions ldid-procursus | grep -F '2.1.5-procursus7'

      - name: Resolve and test core package
        run: |
          set -euo pipefail
          swift package resolve
          test "$(git -C .build/checkouts/ZIPFoundation rev-parse HEAD)" = "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"
          swift test --parallel

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          rm -rf build/PrivateDerivedData build/private-ipa
          xcodebuild \
            -project CloudCodeIOS.xcodeproj \
            -scheme CloudCodeIOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/PrivateDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Embed private Provider bootstrap
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          APP_PATH="build/PrivateDerivedData/Build/Products/Release-iphoneos/CloudCode.app"
          test -d "$APP_PATH"
          python3 - "$APP_PATH/CloudCode-Provider-Bootstrap.json" <<'PY'
          import json
          import os
          import pathlib
          import sys
          target = pathlib.Path(sys.argv[1])
          payload = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Private Provider bootstrap embedded; secret values were not printed.")
          PY

      - name: Assert stable release is not pre-signed with custom entitlements
        run: |
          set -euo pipefail
          APP_PATH="build/PrivateDerivedData/Build/Products/Release-iphoneos/CloudCode.app"
          MAIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          EMBEDDED_ENTITLEMENTS="$(ldid -e "$APP_PATH/$MAIN_EXECUTABLE" 2>/dev/null || true)"
          if [[ -n "${EMBEDDED_ENTITLEMENTS//[[:space:]]/}" ]]; then
            echo "FAIL: stable TrollStore IPA must remain unsigned so TrollStore can inject its standard fallback identity/keychain entitlements" >&2
            printf '%s\n' "$EMBEDDED_ENTITLEMENTS" >&2
            exit 1
          fi
          echo 'PASS: release app is unsigned and has no pre-embedded custom entitlement dictionary'

      - name: TrollStore fallback-signing compatibility preflight
        run: |
          set -euo pipefail
          APP_PATH="build/PrivateDerivedData/Build/Products/Release-iphoneos/CloudCode.app"
          PREFLIGHT="$RUNNER_TEMP/CloudCode-trollstore-fallback-preflight.app"
          rm -rf "$PREFLIGHT"
          cp -R "$APP_PATH" "$PREFLIGHT"
          while IFS= read -r dylib; do
            ldid -S "$dylib"
          done < <(find "$PREFLIGHT" -type f -name '*.dylib' -print)
          while IFS= read -r framework; do
            framework_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$framework/Info.plist")"
            test -f "$framework/$framework_name"
            ldid -S "$framework/$framework_name"
          done < <(find "$PREFLIGHT" -type d -name '*.framework' -print)
          MAIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PREFLIGHT/Info.plist")"
          ldid -SEntitlements/TrollStoreFallback.entitlements "$PREFLIGHT/$MAIN_EXECUTABLE"
          ENTITLEMENTS="$RUNNER_TEMP/cloudcode-trollstore-fallback-entitlements.plist"
          ldid -e "$PREFLIGHT/$MAIN_EXECUTABLE" > "$ENTITLEMENTS"
          plutil -lint "$ENTITLEMENTS" >/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$ENTITLEMENTS")" = 'TROLLTROLL.*'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$ENTITLEMENTS")" = 'TROLLTROLL'
          /usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' "$ENTITLEMENTS" | grep -F 'TROLLTROLL.*'
          rm -rf "$PREFLIGHT" "$ENTITLEMENTS"
          echo 'PASS: current app bundle survives TrollStore-style fallback signing and includes the Keychain identity/access group needed by Security.framework'

      - name: Package stable private TrollStore IPA
        run: |
          set -euo pipefail
          APP_PATH="build/PrivateDerivedData/Build/Products/Release-iphoneos/CloudCode.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          test "$VERSION" = '1.0.3'
          test "$BUILD" = '4'
          mkdir -p build/private-ipa/Payload
          cp -R "$APP_PATH" build/private-ipa/Payload/
          (cd build/private-ipa && zip -qry "../CloudCode-iOS-TrollStore-STABLE-${VERSION}-build${BUILD}.ipa" Payload)

      - name: Verify private IPA and secret isolation
        run: |
          set -euo pipefail
          bash scripts/verify_private_ipa.sh build/CloudCode-iOS-TrollStore-STABLE-1.0.3-build4.ipa
          bash scripts/test_verify_ipa_negative.sh build/CloudCode-iOS-TrollStore-STABLE-1.0.3-build4.ipa
          if find . -path './.git' -prune -o -type f \( -name '*.ipa' -o -name '*Provider-Bootstrap*.json' \) -print | grep -vE '^\./build/' | grep -q .; then
            echo "FAIL: private build material escaped the build directory" >&2
            exit 1
          fi
          if grep -R -E --line-number 'sk-[A-Za-z0-9]{20,}' Sources Tests docs scripts .github; then
            echo "FAIL: API-Key-shaped material found in tracked files" >&2
            exit 1
          fi
          if grep -R -E --line-number 'uses: [^#]+@(v[0-9]+|main|master)([[:space:]]|$)' .github/workflows; then
            echo "FAIL: GitHub Action is not pinned to an immutable commit SHA" >&2
            exit 1
          fi

      - name: Encrypt private IPA before artifact upload
        env:
          CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD: ${{ secrets.CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in build/CloudCode-iOS-TrollStore-STABLE-1.0.3-build4.ipa \
            -out build/CloudCode-iOS-TrollStore-STABLE-1.0.3-build4.ipa.enc \
            -pass env:CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD
          rm -rf build/private-ipa build/CloudCode-iOS-TrollStore-STABLE-1.0.3-build4.ipa build/PrivateDerivedData
          test -s build/CloudCode-iOS-TrollStore-STABLE-1.0.3-build4.ipa.enc
          test ! -e build/CloudCode-iOS-TrollStore-STABLE-1.0.3-build4.ipa

      - name: Upload encrypted private IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CloudCode-iOS-TrollStore-STABLE-1.0.3-build4-private-encrypted
          path: build/CloudCode-iOS-TrollStore-STABLE-1.0.3-build4.ipa.enc
          if-no-files-found: error
          retention-days: 1
