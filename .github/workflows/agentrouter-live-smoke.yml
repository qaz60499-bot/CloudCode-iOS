name: AgentRouter Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentrouter-live-smoke:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate AgentRouter key-scoped host and protocol matrix
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          PROVIDER_ID = "https-agentrouter-org"
          LEGACY_FINGERPRINT = "105a3fce9a105c41472b926f6448a91be2f9726d5e074adbaaa2206f4d6dbf23"
          CURRENT_ORIGIN = "https://co.agentrouter.org"
          LEGACY_ORIGIN = "https://agentrouter.org"
          CLIENT_HEADERS = {
              "User-Agent": "claude-cli/1.0.120 (external, cli)",
              "x-app": "cli",
              "anthropic-beta": "claude-code-20250219",
              "x-stainless-lang": "js",
              "x-stainless-package-version": "0.60.0",
              "x-stainless-runtime": "node",
              "x-stainless-runtime-version": "v22.0.0",
              "x-stainless-os": "Windows",
              "x-stainless-arch": "x64",
          }

          bootstrap = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])
          provider = next((p for p in bootstrap.get("providers", []) if p.get("providerID") == PROVIDER_ID), None)
          if not provider or not provider.get("keys"):
              raise SystemExit("FAIL: private bootstrap is missing AgentRouter")
          secret = provider["keys"][0].get("secret", "")
          if not secret:
              raise SystemExit("FAIL: AgentRouter key is empty")
          fingerprint = hashlib.sha256(secret.encode("utf-8")).hexdigest()
          print(f"AGENTROUTER_KEY_FINGERPRINT_MATCHES_LEGACY={str(fingerprint == LEGACY_FINGERPRINT).lower()}")

          origins = [LEGACY_ORIGIN, CURRENT_ORIGIN] if fingerprint == LEGACY_FINGERPRINT else [CURRENT_ORIGIN, LEGACY_ORIGIN]

          def request(origin, path, payload=None, anthropic=False):
              headers = {"Accept": "application/json", "Authorization": f"Bearer {secret}", **CLIENT_HEADERS}
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              if anthropic:
                  headers["anthropic-version"] = "2023-06-01"
              req = urllib.request.Request(origin + path, data=data, headers=headers, method="POST" if data is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return int(response.status), response.read(262144), response.headers.get("Content-Type", "")
              except urllib.error.HTTPError as exc:
                  return int(exc.code), exc.read(262144), exc.headers.get("Content-Type", "")
              except Exception as exc:
                  return 0, str(exc).encode("utf-8", "replace")[:4096], ""

          def text(body):
              return body[:262144].decode("utf-8", "replace").casefold()

          def api_response(body, content_type):
              media = content_type.split(";")[0].strip().casefold()
              stripped = body.lstrip()
              return "json" in media or stripped.startswith(b"{") or stripped.startswith(b"[") or stripped.startswith(b"data:")

          def classify(status, body):
              value = text(body)
              if 200 <= status < 300:
                  return "OK"
              if status == 0:
                  return "NETWORK"
              if any(m in value for m in ("unauthorized_client_error", "unauthorized client detected", "client not allowed", "forbidden client")):
                  return "CLIENT_REJECTED"
              if status == 429:
                  return "RATE_LIMITED"
              if any(m in value for m in ("insufficient_user_quota", "insufficient balance", "quota exhausted", "余额不足", "额度已用尽", "预扣费额度失败")):
                  return "CAPACITY"
              if status == 401 or (status == 403 and any(m in value for m in ("invalid api key", "invalid_api_key", "authentication", "api key invalid"))):
                  return "AUTH"
              if any(m in value for m in ("model_not_found", "model not found", "no available channel", "模型不存在", "无可用渠道")):
                  return "MODEL_UNAVAILABLE"
              if status in (404, 405):
                  return "ENDPOINT_MISMATCH"
              if 500 <= status < 600:
                  return "UPSTREAM_5XX"
              return "OTHER_HTTP"

          def extract_models(body):
              try:
                  payload = json.loads(body.decode("utf-8", "replace"))
              except Exception:
                  return []
              raw = payload.get("data") or payload.get("models") or [] if isinstance(payload, dict) else payload
              if not isinstance(raw, list):
                  return []
              result = []
              for item in raw:
                  if isinstance(item, str):
                      model = item.strip()
                  elif isinstance(item, dict):
                      model = str(item.get("id") or item.get("model") or item.get("name") or "").strip()
                  else:
                      model = ""
                  if model and model not in result:
                      result.append(model)
              return result

          accepted_origin = None
          discovered = []
          for index, origin in enumerate(origins):
              status, body, content_type = request(origin, "/v1/models")
              models = extract_models(body) if 200 <= status < 300 else []
              print(
                  "AGENTROUTER_CATALOG_ROUTE "
                  f"candidate={index} origin={origin} status={status} classification={classify(status, body)} "
                  f"api_response={str(api_response(body, content_type)).lower()} model_count={len(models)}"
              )
              if 200 <= status < 300 and models:
                  accepted_origin = origin
                  discovered = models
                  break
          if accepted_origin is None:
              raise SystemExit("FAIL: no AgentRouter origin returned an authenticated non-empty /v1/models catalog")

          protocol_matrix = (
              ("anthropic", "/v1/messages", True),
              ("openai_responses", "/v1/responses", False),
              ("openai_chat", "/v1/chat/completions", False),
          )
          target_models = [m for m in ("claude-opus-4-8", "claude-opus-5", "deepseek-v4-flash", "glm-5.3", "gpt-5.6-sol") if m in discovered]
          if not target_models:
              raise SystemExit("FAIL: authenticated AgentRouter catalog contains none of the expected text models")

          hard_failures = []
          for model in target_models:
              successful = []
              route_evidence = []
              for protocol, path, anthropic in protocol_matrix:
                  if protocol == "openai_responses":
                      payload = {"model": model, "max_output_tokens": 1, "input": "Reply OK"}
                  else:
                      payload = {"model": model, "max_tokens": 1, "stream": False, "messages": [{"role": "user", "content": "Reply OK"}]}
                  status, body, content_type = request(accepted_origin, path, payload=payload, anthropic=anthropic)
                  classification = classify(status, body)
                  if 200 <= status < 300 and api_response(body, content_type):
                      successful.append(protocol)
                  if classification in ("OK", "CAPACITY", "RATE_LIMITED", "MODEL_UNAVAILABLE", "ENDPOINT_MISMATCH", "UPSTREAM_5XX", "OTHER_HTTP"):
                      route_evidence.append(protocol)
                  print(
                      "AGENTROUTER_PROTOCOL_MATRIX "
                      f"origin={accepted_origin} model={model} protocol={protocol} endpoint={path} "
                      f"status={status} classification={classification} body_bytes={len(body)}"
                  )
              print(f"AGENTROUTER_MODEL_RESULT model={model} successful={','.join(successful) or 'none'}")
              if not successful and not route_evidence:
                  hard_failures.append(model)

          if hard_failures:
              raise SystemExit("FAIL: models had only auth/client/transport failures across all bounded protocols: " + ",".join(hard_failures))
          print(f"AGENTROUTER_LIVE_SMOKE_OK origin={accepted_origin} models={len(target_models)}")
          PY
