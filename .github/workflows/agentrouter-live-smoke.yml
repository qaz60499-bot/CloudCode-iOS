name: AgentRouter Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentrouter-live-smoke:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate AgentRouter key-scoped host and protocol matrix
        env:
          CLOUDCODE_PROVIDER_BOOTSTRAP: ${{ secrets.CLOUDCODE_PROVIDER_BOOTSTRAP }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          PROVIDER_ID = "https-agentrouter-org"
          LEGACY_FINGERPRINT = "105a3fce9a105c41472b926f6448a91be2f9726d5e074adbaaa2206f4d6dbf23"
          CURRENT_ORIGIN = "https://co.agentrouter.org"
          LEGACY_ORIGIN = "https://agentrouter.org"
          EXPECTED_MODELS = (
              "claude-opus-4-8",
              "claude-opus-5",
              "deepseek-v4-flash",
              "glm-5.3",
              "gpt-5.6-sol",
          )
          CLIENT_HEADERS = {
              "User-Agent": "claude-cli/1.0.120 (external, cli)",
              "x-app": "cli",
              "anthropic-beta": "claude-code-20250219",
              "x-stainless-lang": "js",
              "x-stainless-package-version": "0.60.0",
              "x-stainless-runtime": "node",
              "x-stainless-runtime-version": "v22.0.0",
              "x-stainless-os": "Windows",
              "x-stainless-arch": "x64",
          }

          bootstrap = json.loads(os.environ["CLOUDCODE_PROVIDER_BOOTSTRAP"])
          provider = next((p for p in bootstrap.get("providers", []) if p.get("providerID") == PROVIDER_ID), None)
          if not provider or not provider.get("keys"):
              raise SystemExit("FAIL: private bootstrap is missing AgentRouter")
          secret = provider["keys"][0].get("secret", "")
          if not secret:
              raise SystemExit("FAIL: AgentRouter key is empty")

          fingerprint = hashlib.sha256(secret.encode("utf-8")).hexdigest()
          legacy_key = fingerprint == LEGACY_FINGERPRINT
          print(f"AGENTROUTER_KEY_FINGERPRINT_MATCHES_LEGACY={str(legacy_key).lower()}")
          origins = [LEGACY_ORIGIN, CURRENT_ORIGIN] if legacy_key else [CURRENT_ORIGIN, LEGACY_ORIGIN]

          def request(origin, path, payload=None, anthropic=False):
              headers = {
                  "Accept": "text/event-stream, application/json",
                  "Authorization": f"Bearer {secret}",
                  **CLIENT_HEADERS,
              }
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              if anthropic:
                  headers["anthropic-version"] = "2023-06-01"
              req = urllib.request.Request(origin + path, data=data, headers=headers, method="POST" if data is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return int(response.status), response.read(262144), response.headers.get("Content-Type", "")
              except urllib.error.HTTPError as exc:
                  return int(exc.code), exc.read(262144), exc.headers.get("Content-Type", "")
              except Exception as exc:
                  return 0, str(exc).encode("utf-8", "replace")[:4096], ""

          def text(body):
              return body[:262144].decode("utf-8", "replace").casefold()

          def api_response(body, content_type):
              media = content_type.split(";")[0].strip().casefold()
              stripped = body.lstrip()
              return "json" in media or "event-stream" in media or stripped.startswith(b"{") or stripped.startswith(b"[") or stripped.startswith(b"data:")

          def classify(status, body, content_type):
              value = text(body)
              if status == 0:
                  return "NETWORK"
              if any(m in value for m in ("unauthorized_client_error", "unauthorized client detected", "client not allowed", "forbidden client")):
                  return "CLIENT_REJECTED"
              if status == 429:
                  return "RATE_LIMITED"
              if any(m in value for m in ("insufficient_user_quota", "insufficient balance", "quota exhausted", "余额不足", "额度已用尽", "预扣费额度失败")):
                  return "CAPACITY"
              if status == 401 or (status == 403 and any(m in value for m in ("invalid api key", "invalid_api_key", "authentication", "api key invalid"))):
                  return "AUTH"
              if any(m in value for m in ("model_not_found", "model not found", "no available channel", "模型不存在", "无可用渠道")):
                  return "MODEL_UNAVAILABLE"
              if 200 <= status < 300:
                  return "OK" if api_response(body, content_type) else "NON_API_2XX"
              if status in (404, 405):
                  return "ENDPOINT_MISMATCH"
              if status in (400, 422):
                  return "REQUEST_SHAPE"
              if 500 <= status < 600:
                  return "UPSTREAM_5XX"
              return "OTHER_HTTP"

          def extract_models(body):
              try:
                  payload = json.loads(body.decode("utf-8", "replace"))
              except Exception:
                  return []
              raw = payload.get("data") or payload.get("models") or [] if isinstance(payload, dict) else payload
              if not isinstance(raw, list):
                  return []
              result = []
              for item in raw:
                  if isinstance(item, str):
                      model = item.strip()
                  elif isinstance(item, dict):
                      model = str(item.get("id") or item.get("model") or item.get("name") or "").strip()
                  else:
                      model = ""
                  if model and model not in result:
                      result.append(model)
              return result

          # Catalog is evidence only. A legacy AgentRouter origin can return HTTP 200 non-API
          # content from /v1/models while direct inference remains usable.
          discovered = []
          for index, origin in enumerate(origins):
              status, body, content_type = request(origin, "/v1/models")
              classification = classify(status, body, content_type)
              models = extract_models(body) if classification == "OK" else []
              for model in models:
                  if model not in discovered:
                      discovered.append(model)
              print(
                  "AGENTROUTER_CATALOG_ROUTE "
                  f"candidate={index} origin={origin} status={status} classification={classification} "
                  f"api_response={str(api_response(body, content_type)).lower()} model_count={len(models)}"
              )
          if discovered:
              print(f"AGENTROUTER_CATALOG_EVIDENCE model_count={len(discovered)} expected_hits={sum(m in discovered for m in EXPECTED_MODELS)}")
          else:
              print("AGENTROUTER_CATALOG_EVIDENCE unavailable=true direct_inference_required=true")

          protocol_matrix = (
              ("anthropic", "/v1/messages", True),
              ("openai_chat", "/v1/chat/completions", False),
          )

          ready_models = []
          capacity_models = []
          unavailable_models = []
          compatible_models = []
          incompatible_models = []
          accepted_origins = []

          for model in EXPECTED_MODELS:
              ready_routes = []
              capacity_routes = []
              unavailable_routes = []
              compatible_routes = []
              hard_routes = []

              for origin_index, origin in enumerate(origins):
                  for protocol, path, anthropic in protocol_matrix:
                      if anthropic:
                          payload = {
                              "model": model,
                              "max_tokens": 8,
                              "stream": True,
                              "messages": [{"role": "user", "content": "Reply OK"}],
                          }
                      else:
                          payload = {
                              "model": model,
                              "stream": True,
                              "messages": [{"role": "user", "content": "Reply OK"}],
                          }
                      status, body, content_type = request(origin, path, payload=payload, anthropic=anthropic)
                      classification = classify(status, body, content_type)
                      api_shape = api_response(body, content_type)
                      route = f"{origin}|{protocol}|{classification}"
                      print(
                          "AGENTROUTER_PROTOCOL_MATRIX "
                          f"candidate={origin_index} origin={origin} model={model} protocol={protocol} endpoint={path} "
                          f"status={status} classification={classification} api_response={str(api_shape).lower()} body_bytes={len(body)}"
                      )

                      if classification == "OK":
                          ready_routes.append(route)
                      elif classification in ("CAPACITY", "RATE_LIMITED"):
                          capacity_routes.append(route)
                      elif classification == "MODEL_UNAVAILABLE":
                          unavailable_routes.append(route)
                      elif classification in ("REQUEST_SHAPE", "ENDPOINT_MISMATCH", "UPSTREAM_5XX", "OTHER_HTTP") and api_shape:
                          # API-shaped non-auth evidence proves this Key reached a bounded route,
                          # but it is not called READY.
                          compatible_routes.append(route)
                      else:
                          hard_routes.append(route)

              if ready_routes:
                  model_state = "READY"
                  ready_models.append(model)
                  evidence_routes = ready_routes
              elif capacity_routes:
                  model_state = "CAPACITY"
                  capacity_models.append(model)
                  evidence_routes = capacity_routes
              elif unavailable_routes:
                  model_state = "MODEL_UNAVAILABLE"
                  unavailable_models.append(model)
                  evidence_routes = unavailable_routes
              elif compatible_routes:
                  model_state = "COMPATIBLE"
                  compatible_models.append(model)
                  evidence_routes = compatible_routes
              else:
                  model_state = "INCOMPATIBLE"
                  incompatible_models.append(model)
                  evidence_routes = hard_routes

              for route in evidence_routes:
                  origin = route.split("|", 1)[0]
                  if origin not in accepted_origins:
                      accepted_origins.append(origin)
              print(
                  "AGENTROUTER_MODEL_RESULT "
                  f"model={model} state={model_state} ready_routes={len(ready_routes)} capacity_routes={len(capacity_routes)} "
                  f"unavailable_routes={len(unavailable_routes)} compatible_routes={len(compatible_routes)} hard_routes={len(hard_routes)}"
              )

          if incompatible_models:
              raise SystemExit(
                  "FAIL: models had only auth/client/non-API/transport failures across all bounded routes: "
                  + ",".join(incompatible_models)
              )

          overall_state = "READY" if ready_models else ("CAPACITY" if capacity_models else "COMPATIBLE")
          print(
              "AGENTROUTER_LIVE_SMOKE_OK "
              f"state={overall_state} origins={','.join(accepted_origins) or 'none'} "
              f"ready_models={','.join(ready_models) or 'none'} capacity_models={','.join(capacity_models) or 'none'} "
              f"model_unavailable={','.join(unavailable_models) or 'none'} compatible_models={','.join(compatible_models) or 'none'}"
          )
          PY
