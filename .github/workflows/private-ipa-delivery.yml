name: Private IPA Secure Delivery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Private TrollStore Stable IPA run ID
        required: true
        type: string
      delivery_public_key_b64:
        description: Base64 PEM RSA public key used only to wrap the one-time delivery key
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  rewrap-verified-private-ipa:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Validate source run and download encrypted artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha,name)"
          python3 - "$RUN_JSON" <<'PY'
          import json
          import sys
          run = json.loads(sys.argv[1])
          if run.get("conclusion") != "success":
              raise SystemExit("FAIL: source private IPA run is not successful")
          if run.get("name") != "Private TrollStore Stable IPA":
              raise SystemExit("FAIL: source run is not the stable private IPA workflow")
          head = run.get("headSha") or ""
          if len(head) != 40:
              raise SystemExit("FAIL: source run HEAD is invalid")
          print(f"SOURCE_HEAD={head}")
          PY
          mkdir -p "$RUNNER_TEMP/source"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name CloudCode-iOS-TrollStore-STABLE-1.0.4-build5-private-encrypted \
            --dir "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa.enc"

      - name: Decrypt only in runner and verify IPA metadata
        env:
          CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD: ${{ secrets.CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD"
          mkdir -p "$RUNNER_TEMP/delivery"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$RUNNER_TEMP/source/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa.enc" \
            -out "$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa" \
            -pass env:CLOUDCODE_PRIVATE_ARTIFACT_PASSWORD
          test -s "$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa"
          unzip -tq "$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa" >/dev/null
          unzip -p "$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa" Payload/CloudCode.app/Info.plist > "$RUNNER_TEMP/Info.plist"
          plutil -lint "$RUNNER_TEMP/Info.plist" >/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Info.plist")" = '1.0.4'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Info.plist")" = '5'
          unzip -l "$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa" | grep -F 'Payload/CloudCode.app/CloudCode-Provider-Bootstrap.json' >/dev/null

      - name: Re-encrypt with one-time RSA delivery key
        env:
          DELIVERY_PUBLIC_KEY_B64: ${{ inputs.delivery_public_key_b64 }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$DELIVERY_PUBLIC_KEY_B64"
          printf '%s' "$DELIVERY_PUBLIC_KEY_B64" | base64 -D > "$RUNNER_TEMP/delivery-public.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/delivery-public.pem" -noout >/dev/null
          KEY_HEX="$(openssl rand -hex 32)"
          IV_HEX="$(openssl rand -hex 16)"
          IPA="$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" \
            -in "$IPA" \
            -out "$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa.delivery.enc"
          printf '%s:%s' "$KEY_HEX" "$IV_HEX" > "$RUNNER_TEMP/delivery-key.txt"
          openssl pkeyutl -encrypt -pubin \
            -inkey "$RUNNER_TEMP/delivery-public.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -in "$RUNNER_TEMP/delivery-key.txt" \
            -out "$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.key.enc"
          SOURCE_HEAD="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          IPA_SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          IPA_SIZE="$(stat -f '%z' "$IPA")"
          printf 'version=1.0.4\nbuild=5\nsource_run_id=%s\nsource_head=%s\nsha256=%s\nsize_bytes=%s\n' \
            "$SOURCE_RUN_ID" "$SOURCE_HEAD" "$IPA_SHA" "$IPA_SIZE" \
            > "$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.metadata.txt"
          rm -f "$IPA" "$RUNNER_TEMP/delivery-key.txt" "$RUNNER_TEMP/delivery-public.pem" "$RUNNER_TEMP/Info.plist"
          test ! -e "$IPA"
          test -s "$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa.delivery.enc"
          test -s "$RUNNER_TEMP/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.key.enc"

      - name: Upload public-key encrypted delivery bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CloudCode-iOS-TrollStore-STABLE-1.0.4-build5-secure-delivery
          path: |
            ${{ runner.temp }}/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.ipa.delivery.enc
            ${{ runner.temp }}/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.key.enc
            ${{ runner.temp }}/delivery/CloudCode-iOS-TrollStore-STABLE-1.0.4-build5.metadata.txt
          if-no-files-found: error
          retention-days: 1
