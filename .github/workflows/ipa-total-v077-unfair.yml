name: IPA Total V077 unfair isolated arm64 audit
on:
  push:
    branches: [ci/ipa-total-v077-unfair-20261030]
    paths:
      - '.github/workflows/ipa-total-v077-unfair.yml'
      - 'research/ipa-total-v077/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-unfair:
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
      - name: Verify pinned upstream and compile toolchain
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          git clone -q https://github.com/lbr77/unfair.git "$RUNNER_TEMP/unfair-upstream"
          git -C "$RUNNER_TEMP/unfair-upstream" checkout --detach a754437649b1428e07918c0315a678ed7fc57dec
          test "$(git -C "$RUNNER_TEMP/unfair-upstream" rev-parse HEAD)" = "a754437649b1428e07918c0315a678ed7fc57dec"
          cp research/ipa-total-v077/AppBundleStager.swift "$RUNNER_TEMP/unfair-upstream/Sources/UnfairKit/AppBundleStager.swift"
          git -C "$RUNNER_TEMP/unfair-upstream" diff --check
          shasum -a 256 "$RUNNER_TEMP/unfair-upstream/Sources/UnfairKit/AppBundleStager.swift"
      - name: Execute disposable macOS staging rollback test
        shell: bash
        run: |
          set -euo pipefail
          python3 research/ipa-total-v077/ios166-v077-unfair-staging-macos-smoke.py --source research/ipa-total-v077/AppBundleStager.swift
      - name: Compile pinned patched source for iOS arm64
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unfair-upstream"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          # SwiftPM's native CLI can incorrectly link with the macOS SDK
          # even when --triple and --sdk are set; use Xcode's native iOS destination.
          python3 -c 'from pathlib import Path; p=Path("Package.swift"); s=p.read_text(); needle=".macOS(.v10_15),"; assert needle in s; p.write_text(s.replace(needle, needle+"\n        .iOS(.v16),", 1))'
          xcodebuild -list
          xcodebuild -scheme unfair-swift \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/unfair-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            build
          BIN="$(find "$RUNNER_TEMP/unfair-ios-derived/Build/Products" -type f -name unfair-swift -print -quit)"
          test -n "$BIN"
          test -s "$BIN"
          file "$BIN"
          BUILD_INFO="$(xcrun vtool -show-build "$BIN")"
          printf '%s\n' "$BUILD_INFO"
          printf '%s\n' "$BUILD_INFO" | grep -Eq 'platform IOS'
          printf '%s\n' "$BUILD_INFO" | grep -Eq 'minos 16[.]0'
          # Fail closed on the known SwiftPM macOS SDK mislink issue.
          printf '%s\n' "$BUILD_INFO" | grep -Eq 'sdk 18[.]5'
          xcrun otool -L "$BIN"
          xcrun dwarfdump --uuid "$BIN"
          shasum -a 256 "$BIN"
          cp "$BIN" "$RUNNER_TEMP/ipa-total-v077-unfair-arm64-unsigned"
      - name: Preserve source/build evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-total-v077-unfair-build-evidence
          path: ${{ runner.temp }}/ipa-total-v077-unfair-arm64-unsigned
          if-no-files-found: ignore
          retention-days: 7
