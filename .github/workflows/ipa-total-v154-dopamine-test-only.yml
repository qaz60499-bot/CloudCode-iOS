name: IPA Total V154 Dopamine rootless injection TEST ONLY
on:
  push:
    branches:
      - ci/ipa-total-v154-dopamine-rootless-20261101
    paths:
      - .github/workflows/ipa-total-v154-dopamine-test-only.yml
      - tools/chatgpt-compat/V154-Dopamine-Inject/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rootless-iphoneos-arm64-injector-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Obtain build-only Theos toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ldid >/dev/null; then brew install ldid; fi
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          test -f "$RUNNER_TEMP/theos/makefiles/common.mk"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Compile actual iPhoneOS16.6 arm64 rootless ElleKit test tweak .deb
        shell: bash
        run: |
          set -euo pipefail
          cd tools/chatgpt-compat/V154-Dopamine-Inject
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          test -f .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/IPACompatV154.dylib
          test -f .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/IPACompatV154.plist
          test ! -f .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/OFFICIAL-PROFILE-NOT-INSTALLABLE.plist
          grep -F 'cc.guess.ipatotal.swiftabi.v150' .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/IPACompatV154.plist
          ! grep -F 'com.openai.chat' .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/IPACompatV154.plist
          file .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/IPACompatV154.dylib | grep -F arm64
          xcrun otool -l .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/IPACompatV154.dylib > "$GITHUB_WORKSPACE/v154-loadcommands.txt"
          grep -A5 LC_BUILD_VERSION "$GITHUB_WORKSPACE/v154-loadcommands.txt" | grep -E 'minos +16\.6'
          xcrun nm -gU .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/IPACompatV154.dylib | grep IPACompatV154InjectionState
          find packages -maxdepth 1 -name '*.deb' -size +1k | grep .
          shasum -a 256 packages/*.deb > "$GITHUB_WORKSPACE/v154-SHA256SUMS.txt"
      - name: Compile the official exact-version guard in isolation without packaging it
        shell: bash
        run: |
          set -euo pipefail
          cd tools/chatgpt-compat/V154-Dopamine-Inject
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.6 -isysroot "$SDK" \
            -miphoneos-version-min=16.6 -fobjc-arc -Wall -Wextra -Werror -O2 \
            -DIPA_V154_OFFICIAL=1 -dynamiclib -framework Foundation \
            Tweak.m -o "$RUNNER_TEMP/official-version-guard-NOT-INSTALLABLE.dylib"
          file "$RUNNER_TEMP/official-version-guard-NOT-INSTALLABLE.dylib" | grep -F arm64
          xcrun otool -l "$RUNNER_TEMP/official-version-guard-NOT-INSTALLABLE.dylib" | grep -A5 LC_BUILD_VERSION | grep -E 'minos +16\.6'
          rm "$RUNNER_TEMP/official-version-guard-NOT-INSTALLABLE.dylib"
          printf '%s\n' 'PASS_COMPILED_IOS166_ROOTLESS_TWEAK' 'TEST_FILTER_V150_ONLY' \
            'OFFICIAL_PROFILE_NOT_PACKAGED' 'OFFICIAL_APP_NOT_INJECTED' \
            'FAIRPLAY_AUTHORIZATION_UNRESOLVED' > "$GITHUB_WORKSPACE/v154-BOUNDARY.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-total-v154-rootless-ELLEKIT-V150-TEST-ONLY-NOT-OFFICIAL
          path: |
            tools/chatgpt-compat/V154-Dopamine-Inject/packages/*.deb
            v154-BOUNDARY.txt
            v154-loadcommands.txt
            v154-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
