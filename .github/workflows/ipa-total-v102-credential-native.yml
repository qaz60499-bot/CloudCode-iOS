name: IPA Total V102 native credential tool (research only)

on:
  push:
    branches:
      - ci/ipa-total-v102-licensed-credential-native-20261031
    paths:
      - .github/workflows/ipa-total-v102-credential-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-native:
    name: Build pinned upstream credential retrieval iOS arm64
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout isolated workflow repository
        uses: actions/checkout@v4

      - name: Obtain pinned upstream source (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/fairplay-decrypt
          cd vendor/fairplay-decrypt
          git init -q
          git remote add origin https://github.com/EthanArbuckle/fairplay-decrypt.git
          git fetch --depth=1 origin bb09a61046f5c99eb1795589a307646df04b26d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = bb09a61046f5c99eb1795589a307646df04b26d0
          test -s credential-retrieval/Makefile
          test -s credential-retrieval/credential/credential.c
          test -s credential-retrieval/credential/static-key-table.bin

      - name: Verify Apple iPhoneOS toolchain and ldid
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --find clang
          if ! command -v ldid >/dev/null; then
            brew install ldid
          fi
          command -v ldid

      - name: Compile signed native iOS arm64 research commands
        shell: bash
        run: |
          set -euo pipefail
          make -C vendor/fairplay-decrypt/credential-retrieval bundle
          test -s vendor/fairplay-decrypt/credential-retrieval/build/bundle/credential.ios
          test -s vendor/fairplay-decrypt/credential-retrieval/build/bundle/driver.ios
          test -s vendor/fairplay-decrypt/credential-retrieval/build/bundle/trigger.ios
          file vendor/fairplay-decrypt/credential-retrieval/build/bundle/*.ios
          for bin in vendor/fairplay-decrypt/credential-retrieval/build/bundle/*.ios; do
            file "$bin" | grep -E 'Mach-O 64-bit.*arm64'
          done

      - name: Package only native toolchain outputs and license attribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/credential-v102-native
          cp vendor/fairplay-decrypt/credential-retrieval/build/bundle/credential.ios dist/credential-v102-native/
          cp vendor/fairplay-decrypt/credential-retrieval/build/bundle/driver.ios dist/credential-v102-native/
          cp vendor/fairplay-decrypt/credential-retrieval/build/bundle/trigger.ios dist/credential-v102-native/
          cp vendor/fairplay-decrypt/credential-retrieval/build/bundle/static-key-table.bin dist/credential-v102-native/
          cp vendor/fairplay-decrypt/credential-retrieval/build/bundle/core4-word-table.bin dist/credential-v102-native/
          cp vendor/fairplay-decrypt/LICENSE dist/credential-v102-native/UPSTREAM-LICENSE.txt
          printf '%s\n' 'Research-only native tools. These files are NOT a ChatGPT app.' > dist/credential-v102-native/README.txt
          printf '%s\n' 'No user credentials, Apple login data, private keys, IPA, SINF or personal identifiers were used in this CI.' >> dist/credential-v102-native/README.txt
          printf '%s\n' 'Source: https://github.com/EthanArbuckle/fairplay-decrypt commit bb09a61046f5c99eb1795589a307646df04b26d0' >> dist/credential-v102-native/README.txt
          (cd dist/credential-v102-native && shasum -a 256 credential.ios driver.ios trigger.ios static-key-table.bin core4-word-table.bin > SHA256SUMS.txt)
          test -s dist/credential-v102-native/SHA256SUMS.txt

      - name: Upload research artifact (NOT ChatGPT, NOT decrypted)
        uses: actions/upload-artifact@v4
        with:
          name: ipa-total-v102-credential-retrieval-native-NO-KEYS
          path: dist/credential-v102-native/
          if-no-files-found: error
          retention-days: 7
