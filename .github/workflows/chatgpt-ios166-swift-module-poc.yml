name: ChatGPT iOS16.6 Swift module ABI feasibility

on:
  push:
    branches:
      - ci/chatgpt-ios166-module-abi-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-module-minos-test:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compiler and SDK identity
        run: |
          set -euo pipefail
          xcrun swiftc --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Test official Swift 6.0 Observation and Synchronization source against iOS16.6
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/ios166-swift-official"
          OUT="$RUNNER_TEMP/ios166-swift-probe"
          mkdir -p "$SRC/Observation" "$SRC/Synchronization/Mutex" "$OUT"
          BASE="https://raw.githubusercontent.com/swiftlang/swift/swift-6.0-RELEASE/stdlib/public"
          for f in Locking.swift Observable.swift ObservationRegistrar.swift ObservationTracking.swift ThreadLocal.swift; do
            curl --fail --silent --show-error --location --retry 2 --max-time 30 "$BASE/Observation/Sources/Observation/$f" -o "$SRC/Observation/$f"
          done
          for f in Cell.swift; do
            curl --fail --silent --show-error --location --retry 2 --max-time 30 "$BASE/Synchronization/$f" -o "$SRC/Synchronization/$f"
          done
          for f in DarwinImpl.swift Mutex.swift SpinLoopHint.swift; do
            curl --fail --silent --show-error --location --retry 2 --max-time 30 "$BASE/Synchronization/Mutex/$f" -o "$SRC/Synchronization/Mutex/$f"
          done
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          SWIFTC="$(xcrun --find swiftc)"
          set +e
          "$SWIFTC" -parse-as-library -emit-module -module-name Observation \
            -target arm64-apple-ios16.6 -sdk "$SDK" \
            -emit-module-path "$OUT/Observation.swiftmodule" \
            "$SRC"/Observation/*.swift > "$OUT/observation.stdout" 2> "$OUT/observation.stderr"
          OBS_RC=$?
          "$SWIFTC" -parse-as-library -emit-module -module-name Synchronization \
            -target arm64-apple-ios16.6 -sdk "$SDK" \
            -emit-module-path "$OUT/Synchronization.swiftmodule" \
            "$SRC"/Synchronization/Cell.swift "$SRC"/Synchronization/Mutex/*.swift \
            > "$OUT/synchronization.stdout" 2> "$OUT/synchronization.stderr"
          SYNC_RC=$?
          set -e
          printf 'official_swift_tag=swift-6.0-RELEASE\nobservation_emit_module_rc=%d\nsynchronization_emit_module_rc=%d\n' "$OBS_RC" "$SYNC_RC" | tee "$OUT/status.txt"
          echo '--- Observation first diagnostics ---'
          head -45 "$OUT/observation.stderr"
          echo '--- Synchronization first diagnostics ---'
          head -45 "$OUT/synchronization.stderr"
          echo 'Emitting a Swift module is a compiler-front-end gate only; not linked dylib, ABI equivalence or real app compatibility.'
      - name: Link original Observation Swift sources with real Darwin lock and TLS helpers
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/ios166-swift-official"
          OUT="$RUNNER_TEMP/ios166-swift-probe"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --find clang)"
          SWIFTC="$(xcrun --find swiftc)"
          "$CLANG" -target arm64-apple-ios16.6 -miphoneos-version-min=16.6 -isysroot "$SDK" \
            -Wall -Wextra -Werror -fvisibility=hidden \
            -c tools/chatgpt-compat/ios166-observation-posix-runtime.c -o "$OUT/ios166-observation-runtime.o"
          set +e
          "$SWIFTC" -parse-as-library -emit-library -emit-module -module-name Observation \
            -target arm64-apple-ios16.6 -sdk "$SDK" \
            -emit-module-path "$OUT/Observation.swiftmodule" \
            -Xlinker -install_name -Xlinker @rpath/libswiftObservation.dylib \
            "$SRC"/Observation/*.swift "$OUT/ios166-observation-runtime.o" \
            -o "$OUT/libswiftObservation.dylib" > "$OUT/observation-link.stdout" 2> "$OUT/observation-link.stderr"
          LINK_RC=$?
          set -e
          printf 'observation_dylib_link_rc=%d\n' "$LINK_RC" | tee "$OUT/link-status.txt"
          head -65 "$OUT/observation-link.stderr"
          if [[ "$LINK_RC" -eq 0 ]]; then
            xcrun otool -hv "$OUT/libswiftObservation.dylib"
            xcrun otool -l "$OUT/libswiftObservation.dylib" | grep -A5 LC_BUILD_VERSION | head -8
            xcrun nm -gU "$OUT/libswiftObservation.dylib" > "$OUT/Observation.nm.txt"
            xcrun nm -u "$OUT/libswiftObservation.dylib" > "$OUT/Observation.undefined.txt"
            for name in '_$s11Observation10ObservableMp' '_$s11Observation0A9RegistrarVMa' '_$s11Observation0A9RegistrarVMn' '_$s11Observation0A9RegistrarVACycfC'; do
              if grep -F "$name" "$OUT/Observation.nm.txt" >/dev/null; then
                printf 'EXPORT_MATCH %s\n' "$name"
              else
                printf 'EXPORT_MISSING %s\n' "$name"
              fi
            done
          fi
          echo 'Even a successful link is not a claim of deployment or behavioral ABI compatibility.'
      - name: Match all nine required Observation ABI exports
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios166-swift-probe"
          if [[ ! -e "$OUT/libswiftObservation.dylib" ]]; then
            echo "Observation dylib missing: cannot compare ABI exports" > "$OUT/abi9-status.txt"
            exit 1
          fi
          expected=(
            '_$s11Observation10ObservableMp'
            '_$s11Observation04withA8Tracking_8onChangexxyXE_yyYbcyXKtlF'
            '_$s11Observation0A9RegistrarV12withMutation2of7keyPath_q0_x_s03KeyG0Cyxq_Gq0_yKXEtKAA10ObservableRzr1_lF'
            '_$s11Observation0A9RegistrarV6access_7keyPathyx_s03KeyE0Cyxq_GtAA10ObservableRzr0_lF'
            '_$s11Observation0A9RegistrarV6didSet_7keyPathyx_s03KeyF0Cyxq_GtAA10ObservableRzr0_lF'
            '_$s11Observation0A9RegistrarV7willSet_7keyPathyx_s03KeyF0Cyxq_GtAA10ObservableRzr0_lF'
            '_$s11Observation0A9RegistrarVACycfC'
            '_$s11Observation0A9RegistrarVMa'
            '_$s11Observation0A9RegistrarVMn'
          )
          total=0; ok=0
          xcrun nm -gU "$OUT/libswiftObservation.dylib" > "$OUT/Observation.nm.txt"
          for name in "${expected[@]}"; do
            total=$((total+1))
            if grep -F "$name" "$OUT/Observation.nm.txt" >/dev/null; then
              echo "ABI9_MATCH $name" | tee -a "$OUT/abi9-status.txt"
              ok=$((ok+1))
            else
              echo "ABI9_MISSING $name" | tee -a "$OUT/abi9-status.txt"
            fi
          done
          echo "ABI9_SUMMARY $ok/$total" | tee -a "$OUT/abi9-status.txt"
          [[ "$ok" -eq "$total" ]]
      - name: Link independent Observation client against iOS16.6 candidate
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios166-swift-probe"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cat > "$OUT/Client.swift" <<'SWIFT'
          import Observation
          final class Counter: Observable {
            let registrar = ObservationRegistrar()
            var value = 0
            func current() -> Int {
              registrar.access(self, keyPath: \.value)
              return value
            }
            func increment() {
              registrar.withMutation(of: self, keyPath: \.value) {
                value += 1
              }
            }
          }
          @_cdecl("ios166_observation_client_probe")
          public func observationProbe() -> Int32 {
            let model = Counter()
            let first = withObservationTracking({
              model.current()
            }, onChange: {
              _ = model.current()
            })
            model.increment()
            return Int32(first + model.current())
          }
          SWIFT
          set +e
          xcrun swiftc -parse-as-library -emit-library \
            -module-name CompatObservationClient -target arm64-apple-ios16.6 -sdk "$SDK" \
            -I "$OUT" "$OUT/libswiftObservation.dylib" \
            -Xlinker -rpath -Xlinker @loader_path \
            "$OUT/Client.swift" -o "$OUT/libCompatObservationClient.dylib" \
            > "$OUT/client.stdout" 2> "$OUT/client.stderr"
          CLIENT_RC=$?
          set -e
          echo "observation_client_link_rc=$CLIENT_RC" | tee "$OUT/client-status.txt"
          head -50 "$OUT/client.stderr"
          if [[ "$CLIENT_RC" -eq 0 ]]; then
            xcrun otool -L "$OUT/libCompatObservationClient.dylib" | tee "$OUT/client-loads.txt"
            if grep -F "@rpath/libswiftObservation.dylib" "$OUT/client-loads.txt" >/dev/null && ! grep -F "/usr/lib/swift/libswiftObservation.dylib" "$OUT/client-loads.txt" >/dev/null; then
              echo "CLIENT_LOCAL_OBSERVATION_BIND_PASS" | tee -a "$OUT/client-status.txt"
            else
              echo "CLIENT_LOCAL_OBSERVATION_BIND_FAIL" | tee -a "$OUT/client-status.txt"
              exit 1
            fi
            xcrun nm -u "$OUT/libCompatObservationClient.dylib" > "$OUT/client-undefined.txt"
            xcrun otool -l "$OUT/libCompatObservationClient.dylib" | grep -A5 LC_BUILD_VERSION | head -8
          fi
      - name: Upload isolated probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-ios166-upstream-module-probe
          path: ${{ runner.temp }}/ios166-swift-probe/
          if-no-files-found: warn
