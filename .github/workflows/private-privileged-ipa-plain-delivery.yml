name: Private Privileged IPA Local Plain Delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guidance:
    runs-on: macos-15
    steps:
      - name: Plaintext delivery policy
        run: |
          echo "Plaintext privileged IPA must not be uploaded to a public repository because it embeds private Provider credentials."
          echo "Use the secure delivery workflow for transport, then decrypt locally on the owner's machine and hand off only the final .ipa file."
