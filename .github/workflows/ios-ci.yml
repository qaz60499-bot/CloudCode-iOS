name: iOS CI and IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcode-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version | grep -F '2.46.0'

      - name: Resolve and test core package
        run: |
          set -euo pipefail
          swift package resolve
          test "$(git -C .build/checkouts/ZIPFoundation rev-parse HEAD)" = "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"
          swift test --parallel

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build release app for iOS Simulator
        run: |
          set -euo pipefail
          rm -rf build/SimulatorDerivedData
          xcodebuild \
            -project CloudCodeIOS.xcodeproj \
            -scheme CloudCodeIOS \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch release app in iOS Simulator
        run: |
          set -euo pipefail
          APP_PATH="build/SimulatorDerivedData/Build/Products/Release-iphonesimulator/CloudCode.app"
          test -d "$APP_PATH"
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"], check=True, timeout=180)' "$UDID"
          simctl_bounded() {
            local timeout_seconds="$1"
            shift
            python3 -c 'import subprocess,sys; p=subprocess.run(["xcrun","simctl"]+sys.argv[2:], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=float(sys.argv[1])); sys.stdout.write(p.stdout); sys.stderr.write(p.stderr); raise SystemExit(p.returncode)' "$timeout_seconds" "$@"
          }
          simctl_bounded 120 install "$UDID" "$APP_PATH"
          data_container=""
          for attempt in 1 2 3; do
            if data_container="$(simctl_bounded 60 get_app_container "$UDID" com.cloudcode.ios data)"; then
              break
            fi
            echo "WARN: get_app_container attempt $attempt failed; retrying the same installed app without rebuilding" >&2
            sleep 2
          done
          test -n "$data_container"
          breadcrumb_root="$data_container/Library/Application Support/CloudCode/StartupBreadcrumbs"

          verify_stable_launch() {
            local phase="$1"
            local launch_result pid latest_run
            launch_result="$(simctl_bounded 90 launch "$UDID" com.cloudcode.ios)"
            echo "$phase: $launch_result"
            pid="${launch_result##*: }"
            test -n "$pid"

            # A successful launch syscall is not enough: keep the Release process alive long
            # enough to execute bootstrap and require its crash-survivable stable marker.
            sleep 15
            latest_run="$(find "$breadcrumb_root" -type f -name 'run-*.jsonl' -print 2>/dev/null | while IFS= read -r file; do stat -f '%m %N' "$file"; done | sort -rn | head -1 | cut -d' ' -f2-)"
            if [[ -z "$latest_run" ]] || ! grep -F 'bootstrap.completed' "$latest_run" >/dev/null; then
              echo "FAIL: $phase did not reach bootstrap.completed" >&2
              simctl_bounded 45 spawn "$UDID" log show --last 45s --style compact --predicate 'process == "CloudCode"' || true
              simctl_bounded 30 shutdown "$UDID" >/dev/null 2>&1 || true
              exit 1
            fi
            if ! simctl_bounded 30 terminate "$UDID" com.cloudcode.ios; then
              echo "FAIL: Cloud Code exited before $phase stability check completed" >&2
              simctl_bounded 45 spawn "$UDID" log show --last 45s --style compact --predicate 'process == "CloudCode"' || true
              simctl_bounded 30 shutdown "$UDID" >/dev/null 2>&1 || true
              exit 1
            fi
          }

          verify_stable_launch 'cold-launch'
          for iteration in 1 2 3 4 5; do
            verify_stable_launch "relaunch-$iteration"
          done

          # Exercise the real crash-loop recovery branch instead of only checking it statically.
          # Reuse the container resolved once after install; repeated simctl container lookups are
          # unnecessary and can hang while CoreSimulator is settling after a launch.
          mkdir -p "$breadcrumb_root"
          seed_run="$breadcrumb_root/run-11111111-1111-1111-1111-111111111111.jsonl"
          python3 -c 'import datetime,json,sys; ts=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z"); print(json.dumps({"runID":"11111111-1111-1111-1111-111111111111","timestamp":ts,"stage":"bootstrap.safe.begin"}), file=open(sys.argv[1],"w",encoding="utf-8"))' "$seed_run"
          sleep 1
          recovery_launch="$(simctl_bounded 90 launch "$UDID" com.cloudcode.ios)"
          echo "recovery-launch: $recovery_launch"
          sleep 8
          latest_run="$(find "$breadcrumb_root" -type f -name 'run-*.jsonl' -print 2>/dev/null | while IFS= read -r file; do stat -f '%m %N' "$file"; done | sort -rn | head -1 | cut -d' ' -f2-)"
          test -n "$latest_run"
          if ! grep -F 'bootstrap.recovery.ready' "$latest_run" >/dev/null || ! grep -F 'bootstrap.completed' "$latest_run" >/dev/null; then
            echo "FAIL: simulated prior-crash launch did not enter and complete recovery mode" >&2
            echo "latest startup breadcrumb file: $latest_run" >&2
            cat "$latest_run" >&2 || true
            simctl_bounded 45 spawn "$UDID" log show --last 45s --style compact --predicate 'process == "CloudCode"' || true
            simctl_bounded 30 shutdown "$UDID" >/dev/null 2>&1 || true
            exit 1
          fi
          simctl_bounded 30 terminate "$UDID" com.cloudcode.ios
          rm -f "$seed_run"

          # Reproduce the user-reported post-bootstrap crash-loop precursor: a previous
          # process left an active Agent checkpoint plus the persisted auto-resume bit.
          # A fresh process must recover the checkpoint to interrupted state but MUST NOT
          # automatically replay the Provider request during cold launch.
          tasks_root="$data_container/Library/Application Support/CloudCode/Tasks"
          mkdir -p "$tasks_root"
          checkpoint_file="$tasks_root/checkpoints.json"
          CHECKPOINT_FILE="$checkpoint_file" swift -e 'import Foundation; struct C: Codable { var id: UUID; var sessionID: UUID; var taskName: String; var stepIndex: Int; var stepName: String; var totalSteps: Int; var state: String; var updatedAt: Date; var payload: [String:String] }; let id = UUID(uuidString: "22222222-2222-2222-2222-222222222222")!; let sid = UUID(uuidString: "33333333-3333-3333-3333-333333333333")!; let c = C(id: id, sessionID: sid, taskName: "cold-launch crash-loop regression", stepIndex: 1, stepName: "provider request", totalSteps: 34, state: "running", updatedAt: Date(), payload: ["request":"do-not-replay-on-cold-launch"]); let e = JSONEncoder(); e.dateEncodingStrategy = .iso8601; e.outputFormatting = [.prettyPrinted, .sortedKeys]; let url = URL(fileURLWithPath: ProcessInfo.processInfo.environment["CHECKPOINT_FILE"]!); try e.encode([id:c]).write(to: url, options: .atomic)'
          simctl_bounded 30 spawn "$UDID" defaults write com.cloudcode.ios task.autoResumeUnlessStopped -bool YES
          crashloop_launch="$(simctl_bounded 90 launch "$UDID" com.cloudcode.ios)"
          echo "post-send-crash recovery launch: $crashloop_launch"
          sleep 12
          latest_run="$(find "$breadcrumb_root" -type f -name 'run-*.jsonl' -print 2>/dev/null | while IFS= read -r file; do stat -f '%m %N' "$file"; done | sort -rn | head -1 | cut -d' ' -f2-)"
          test -n "$latest_run"
          if ! grep -F 'runtime.autoresume.coldlaunch.suppressed' "$latest_run" >/dev/null || ! grep -F 'bootstrap.completed' "$latest_run" >/dev/null; then
            echo "FAIL: cold launch did not suppress persisted Agent auto-resume after a process-level interruption" >&2
            cat "$latest_run" >&2 || true
            simctl_bounded 45 spawn "$UDID" log show --last 45s --style compact --predicate 'process == "CloudCode"' || true
            simctl_bounded 30 shutdown "$UDID" >/dev/null 2>&1 || true
            exit 1
          fi
          grep -F 'interrupted' "$checkpoint_file" >/dev/null
          if ! simctl_bounded 30 terminate "$UDID" com.cloudcode.ios; then
            echo "FAIL: Cloud Code exited while suppressing the stale post-send auto-resume state" >&2
            simctl_bounded 45 spawn "$UDID" log show --last 45s --style compact --predicate 'process == "CloudCode"' || true
            simctl_bounded 30 shutdown "$UDID" >/dev/null 2>&1 || true
            exit 1
          fi

          simctl_bounded 30 shutdown "$UDID" >/dev/null 2>&1 || true
          echo 'PASS: Release cold launch, five relaunches, bootstrap crash recovery, and post-send crash-loop suppression remained stable'

      - name: Run iOS settings/provider UI regression smoke
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"], check=True, timeout=180)' "$UDID"
          xcodebuild \
            -project CloudCodeIOS.xcodeproj \
            -scheme CloudCodeIOS \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/UITestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test \
            -only-testing:CloudCodeIOSUITests
          xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          rm -rf build/DerivedData build/ipa
          xcodebuild \
            -project CloudCodeIOS.xcodeproj \
            -scheme CloudCodeIOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/CloudCode.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry ../CloudCode-iOS-unsigned.ipa Payload)

      - name: Verify IPA
        run: bash scripts/verify_ipa.sh build/CloudCode-iOS-unsigned.ipa

      - name: Verify installability guardrails reject broken IPA metadata
        run: bash scripts/test_verify_ipa_negative.sh build/CloudCode-iOS-unsigned.ipa

      - name: Static safety checks
        run: |
          set -euo pipefail
          if grep -R --line-number 'root_exec(' Sources; then
            echo "FAIL: unrestricted root_exec primitive found in Sources" >&2
            exit 1
          fi
          if grep -R --line-number 'removeItem(atPath: "/")' Sources; then
            echo "FAIL: direct filesystem-root deletion primitive found" >&2
            exit 1
          fi
          if grep -R -E --line-number 'sk-[A-Za-z0-9]{20,}' Sources Tests docs scripts .github; then
            echo "FAIL: API-Key-shaped material found in tracked source/test/docs/workflow files" >&2
            exit 1
          fi
          if grep -R -E --line-number 'uses: [^#]+@(v[0-9]+|main|master)([[:space:]]|$)' .github/workflows; then
            echo "FAIL: GitHub Action is not pinned to an immutable commit SHA" >&2
            exit 1
          fi
          grep -F 'simctl_bounded()' .github/workflows/ios-ci.yml >/dev/null
          grep -F 'simctl_bounded 120 install' .github/workflows/ios-ci.yml >/dev/null
          grep -F 'simctl_bounded 90 launch' .github/workflows/ios-ci.yml >/dev/null
          grep -F 'revision: "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"' Package.swift >/dev/null
          grep -F 'revision: 22787ffb59de99e5dc1fbfe80b19c97a904ad48d' project.yml >/dev/null
          if grep -R --line-number 'NSAllowsArbitraryLoads' Sources project.yml Entitlements; then
            echo "FAIL: App Transport Security arbitrary loads must remain disabled" >&2
            exit 1
          fi
          if grep -F 'TrollStore.entitlements' project.yml; then
            echo "FAIL: public Runner build must not use TrollStore private entitlements" >&2
            exit 1
          fi
          for required_trollstore_host_entitlement in \
            '<key>com.apple.private.security.no-sandbox</key>' \
            '<key>platform-application</key>' \
            '<key>com.apple.private.security.storage.AppDataContainers</key>' \
            '<key>com.apple.private.persona-mgmt</key>'; do
            grep -F "$required_trollstore_host_entitlement" Entitlements/TrollStore.entitlements >/dev/null
          done
          if grep -F '<key>com.apple.multitasking.unlimitedassertions</key>' Entitlements/TrollStore.entitlements >/dev/null; then
            echo "FAIL: unlimited background assertion entitlement must remain isolated to the root helper" >&2
            exit 1
          fi
          grep -F '<key>com.apple.multitasking.unlimitedassertions</key>' Entitlements/CloudCodeRootHelper.entitlements >/dev/null
          for gui_only_entitlement in \
            '<key>com.apple.hid.system.server-access</key>' \
            '<key>com.apple.hid.system.user-access-service</key>' \
            '<key>com.apple.private.hid.client.event-dispatch</key>' \
            '<key>com.apple.private.hid.client.event-filter</key>' \
            '<key>com.apple.private.hid.client.event-monitor</key>' \
            '<key>com.apple.private.hid.client.service-protected</key>' \
            '<key>com.apple.private.hid.manager.client</key>' \
            '<key>com.apple.accessibility.api</key>' \
            '<key>com.apple.QuartzCore.cache-asynchronous</key>' \
            '<key>com.apple.QuartzCore.displayable-context</key>' \
            '<key>com.apple.QuartzCore.global-capture</key>' \
            '<key>com.apple.QuartzCore.secure-capture</key>' \
            '<key>com.apple.QuartzCore.secure-mode</key>' \
            '<key>com.apple.QuartzCore.system-layers</key>' \
            '<key>com.apple.private.IOSurface.protected-access</key>' \
            '<key>com.apple.backboard.client</key>'; do
            if grep -F "$gui_only_entitlement" Entitlements/TrollStore.entitlements >/dev/null; then
              echo "FAIL: GUI-only entitlement leaked onto SwiftUI host: $gui_only_entitlement" >&2
              exit 1
            fi
            grep -F "$gui_only_entitlement" Entitlements/CloudCodeRootHelper.entitlements >/dev/null
          done
          for root_helper_storage_entitlement in \
            '<key>com.apple.private.security.container-required</key>' \
            '<key>com.apple.private.security.storage.AppBundles</key>' \
            '<key>com.apple.private.security.container-manager</key>' \
            '<key>com.apple.private.MobileContainerManager.allowed</key>' \
            '<key>com.apple.private.coreservices.canmaplsdatabase</key>' \
            '<key>com.apple.lsapplicationworkspace.rebuildappdatabases</key>' \
            '<key>com.apple.private.security.storage-exempt.heritable</key>' \
            '<key>com.apple.private.MobileInstallationHelperService.InstallDaemonOpsEnabled</key>' \
            '<key>com.apple.private.MobileInstallationHelperService.allowed</key>' \
            '<key>com.apple.private.uninstall.deletion</key>' \
            '<key>com.apple.private.mobileinstall.allowedSPI</key>' \
            '<string>UninstallForLaunchServices</string>' \
            '<string>Uninstall</string>' \
            '<key>com.apple.security.iokit-user-client-class</key>' \
            '<key>com.apple.security.exception.iokit-user-client-class</key>' \
            '<string>IOSurfaceAcceleratorClient</string>' \
            '<string>IOHIDEventServiceFastPathUserClient</string>' \
            '<string>IOHIDLibUserClient</string>'; do
            grep -F "$root_helper_storage_entitlement" Entitlements/CloudCodeRootHelper.entitlements >/dev/null
          done
          grep -F 'ldid -SEntitlements/CloudCodeRootHelper.entitlements "$ROOT_HELPER"' .github/workflows/private-trollstore-privileged-ipa.yml >/dev/null
          grep -F 'CODE_SIGN_ENTITLEMENTS: Entitlements/CloudCode.entitlements' project.yml >/dev/null
          grep -F 'kSecAttrAccessibleWhenUnlockedThisDeviceOnly' Sources/CloudCodeCore/KeychainAPIKeyVault.swift >/dev/null
          if grep -F 'kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly' Sources/CloudCodeCore/KeychainAPIKeyVault.swift; then
            echo "FAIL: Provider Keys must not remain readable while the device is locked" >&2
            exit 1
          fi
          if grep -F 'record("data.keychain_scope", .data, .available' Sources/CloudCodeCore/CapabilityProbe.swift; then
            echo "FAIL: Keychain capability must be runtime-probed rather than hard-coded available" >&2
            exit 1
          fi
          grep -F 'probeOwnKeychain()' Sources/CloudCodeCore/CapabilityProbe.swift >/dev/null
          python3 - <<'PY'
          from pathlib import Path

          capability = Path('Sources/CloudCodeCore/CapabilityProbe.swift').read_text(encoding='utf-8')
          safe = capability.split('public func probeStartupSafe()', 1)[1].split('public func probeExtendedDevice()', 1)[0]
          for forbidden in ('URL(fileURLWithPath: "/var/mobile', 'unrestrictedFilesystemProbe(', 'hasDynamicSymbol(', 'rootHelperCapability()', 'installedApps()', 'probePrivileged(', 'probeOwnKeychain(', 'guiCapabilitySnapshot()'):
              if forbidden in safe:
                  raise SystemExit(f'FAIL: startup-safe capability probe contains forbidden operation: {forbidden}')

          app = Path('Sources/CloudCodeApp/AppEnvironment.swift').read_text(encoding='utf-8')
          bootstrap = app.split('public func bootstrap()', 1)[1].split('public var isRunning', 1)[0]
          for forbidden in ('appResolver.forceRefresh()', 'capabilityProbe.probe()', 'capabilityProbe.probePrivileged()', 'capabilityProbe.probeExtendedDevice()'):
              if forbidden in bootstrap:
                  raise SystemExit(f'FAIL: automatic bootstrap contains privileged/full probe: {forbidden}')
          if 'capabilityProbe.probeStartupSafe()' not in bootstrap:
              raise SystemExit('FAIL: automatic bootstrap must use startup-safe capability probe')
          if 'TrollStoreGUIBackend(diagnosticLogger: diagnosticLogStore)' not in app or 'GUIFallbackExecutor(backend: guiBackend' not in app:
              raise SystemExit('FAIL: AppEnvironment is not wired to the runtime GUI backend with diagnostics')
          if 'GUIFallbackExecutor(backend: UnavailableGUIBackend()' in app:
              raise SystemExit('FAIL: AppEnvironment regressed to the unavailable GUI placeholder')
          refresh = app.split('public func refreshCapabilities()', 1)[1].split('public func refreshFiles()', 1)[0]
          if 'guard capabilityRefreshTask == nil' not in refresh:
              raise SystemExit('FAIL: explicit capability refresh lost duplicate/concurrency guard')
          if 'capabilityProbe.probeExtendedDevice()' not in refresh or 'capabilityProbe.probePrivileged()' not in refresh:
              raise SystemExit('FAIL: explicit refresh must stage extended-device then privileged probing')
          if 'capabilities = extended' in refresh:
              raise SystemExit('FAIL: intermediate extended capability state must not be published before privileged validation completes')
          if 'extendedProbe.begin' not in refresh or 'extendedProbe.end' not in refresh or 'privilegedProbe.begin' not in refresh or 'privilegedProbe.end' not in refresh:
              raise SystemExit('FAIL: explicit capability refresh lost breadcrumb boundaries')

          agent = Path('Sources/CloudCodeCore/AgentCore.swift').read_text(encoding='utf-8')
          if 'await capabilityProbe.probeStartupSafe()' not in agent:
              raise SystemExit('FAIL: ordinary Agent run lost startup-safe capability probe')
          if 'capabilityProbe.probePrivileged()' in agent:
              raise SystemExit('FAIL: ordinary/model-driven Agent execution must never initiate privileged capability probing')
          tool_executor = Path('Sources/CloudCodeCore/ToolExecutors.swift').read_text(encoding='utf-8')
          capability_tool = tool_executor.split('case "capability.probe":', 1)[1].split('case "apps.list":', 1)[0]
          if 'context.capabilityProfile' not in capability_tool:
              raise SystemExit('FAIL: model-driven capability.probe must report the current session capability snapshot')
          if 'probePrivileged()' in capability_tool or 'probeExtendedDevice()' in capability_tool or 'probeStartupSafe()' in capability_tool:
              raise SystemExit('FAIL: model-driven capability.probe must not execute any capability backend')

          adapters = Path('Sources/CloudCodeApp/PlatformAdapters.swift').read_text(encoding='utf-8')
          resolver = adapters.split('public actor IOSAppResolver', 1)[1].split('@MainActor\npublic final class ApprovalCenter', 1)[0]
          for forbidden in ('LSApplicationWorkspace', 'MobileInstallation.framework', 'mobileInstallationUninstallSymbol', 'NSClassFromString', 'class_getInstanceMethod', 'class_getClassMethod', 'method_getImplementation', 'unsafeBitCast'):
              if forbidden in resolver:
                  raise SystemExit(f'FAIL: IOSAppResolver reintroduced main-process private ABI execution: {forbidden}')
          resolver_refresh = resolver.split('private func refresh()', 1)[1].split('private static func isUserApplicationBundlePath', 1)[0]
          if 'EmbeddedRootHelper.enumerateInstalledApps()' not in resolver_refresh:
              raise SystemExit('FAIL: installed-app refresh is no longer isolated in root helper')
          launch = resolver.split('public func launchApplication(bundleID:', 1)[1].split('public func terminateApplication', 1)[0]
          if 'EmbeddedRootHelper.launch(bundleID: bundleID)' not in launch:
              raise SystemExit('FAIL: app launch must execute through the isolated root helper')
          uninstall = resolver.split('public func uninstallApplication(bundleID:', 1)[1].split('private enum UninstallReconciliation', 1)[0]
          if 'EmbeddedRootHelper.uninstall(bundleID: bundleID' not in uninstall or 'EmbeddedRootHelper.installationState(bundleID: bundleID)' not in uninstall:
              raise SystemExit('FAIL: app uninstall and registration verification must execute through the isolated root helper')
          if 'EmbeddedRootHelper.cleanupUnregistered(bundleID: bundleID' not in uninstall or 'unregisteredBundleIDs.contains(bundleID)' not in uninstall:
              raise SystemExit('FAIL: half-uninstalled filesystem orphans lost their explicit reconciliation path')

          helper = Path('Sources/CloudCodeRootHelper/main.m')
          if not helper.exists():
              raise SystemExit('FAIL: CloudCodeRootHelper source is missing')
          helper_text = helper.read_text(encoding='utf-8')
          for marker in ('background-assert-worker', 'posix_spawn(&workerPID', 'targetPID, 1u, 10004u', 'initWithPID:flags:reason:name:withHandler:acquire:', 'initWithPID:flags:reason:name:withHandler:', 'poll(&pollFD, 1, 2500)', 'background-assert: acquired', 'spawn=posix_spawn flags=1 reason=10004', 'BackgroundAssertionWorkerStatus'):
              if marker not in helper_text:
                  raise SystemExit(f'FAIL: privileged background assertion worker lost detached-spawn/runtime marker: {marker}')
          background_section = helper_text.split('static int BackgroundAssertionWorker(', 1)[1].split('static int StopDetachedBackgroundAssertion(', 1)[0]
          if 'fork(' in background_section:
              raise SystemExit('FAIL: background assertion worker must not initialize Objective-C/private frameworks after fork')
          for marker in ('enumerate-json', 'probe-filesystem-json', 'probe-launch', 'probe-uninstall', 'is-installed', 'launch', 'uninstall', 'cleanup-unregistered', 'MCMMetadataIdentifier', 'BundleFilesystemOrphans', 'gui-probe-json', 'gui-tree-json', 'gui-screenshot-base64', 'gui-screenshot-file', 'gui-tap', 'gui-swipe', 'gui-scroll', 'gui-type-base64', 'background-assert-worker', 'background-assert-start', 'background-assert-status', 'background-assert-stop', 'BKSProcessAssertion', 'CloudCode.BackgroundAgent'):
              if marker not in helper_text:
                  raise SystemExit(f'FAIL: root helper command missing: {marker}')
          bridge = Path('Sources/CloudCodeApp/RootHelperBridge.m').read_text(encoding='utf-8')
          for marker in ('CLOUDCODE_HELPER_CAPTURE_LIMIT (1024 * 1024)', 'WIFSIGNALED(status)', 'WNOHANG', 'O_NONBLOCK', 'ETIMEDOUT', 'kill(pid, SIGKILL)', 'CloudCodeSpawnHelperInternal', 'stdoutPipe', 'stderrPipe', 'CloudCodeSpawnHelperWithSeparatedOutput'):
              if marker not in bridge:
                  raise SystemExit(f'FAIL: root helper bridge lost timeout/isolation marker: {marker}')
          bridge_header = Path('Sources/CloudCodeApp/RootHelperBridge.h').read_text(encoding='utf-8')
          for marker in ('CloudCodeSpawnHelperWithOutput', 'CloudCodeSpawnHelperWithSeparatedOutput'):
              if marker not in bridge_header:
                  raise SystemExit(f'FAIL: bounded helper bridge API is missing: {marker}')
          if 'run(["enumerate-json"], privilege: .isolatedUser' not in adapters or 'run(["probe-launch"], privilege: .isolatedUser' not in adapters or 'run(["launch", bundleID], privilege: .isolatedUser' not in adapters:
              raise SystemExit('FAIL: app discovery/launch must use the bounded non-root isolated helper path')
          if 'shouldRefreshIndex()' not in resolver or 'failedIndexRetryAfter' not in resolver or 'negativeBundleIDs' not in resolver:
              raise SystemExit('FAIL: installed-app discovery lost cached-index/bounded-refresh guards')
          if 'timeIntervalSince(lastRefresh)' in resolver:
              raise SystemExit('FAIL: installed-app discovery reintroduced the old 30-second full-rescan TTL')
          if 'run(["probe-uninstall", bundleID], privilege: .root' not in adapters or 'run(["terminate", bundlePath], privilege: .root' not in adapters:
              raise SystemExit('FAIL: destructive/root-required app operations lost root helper gating')
          gui_helper = Path('Sources/CloudCodeRootHelper/GUIAutomation.m')
          if not gui_helper.exists():
              raise SystemExit('FAIL: TrollStore GUI helper source is missing')
          gui_text = gui_helper.read_text(encoding='utf-8')
          if '#import <IOSurface/IOSurface.h>' in gui_text or '-framework IOSurface' in Path('project.yml').read_text(encoding='utf-8'):
