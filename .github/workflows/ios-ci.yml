name: iOS CI and IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcode-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version | grep -F '2.46.0'

      - name: Resolve and test core package
        run: |
          set -euo pipefail
          swift package resolve
          test "$(git -C .build/checkouts/ZIPFoundation rev-parse HEAD)" = "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"
          swift test --parallel

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for iOS Simulator
        run: |
          set -euo pipefail
          rm -rf build/SimulatorDerivedData
          xcodebuild \
            -project CloudCodeIOS.xcodeproj \
            -scheme CloudCodeIOS \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch app in iOS Simulator
        run: |
          set -euo pipefail
          APP_PATH="build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/CloudCode.app"
          test -d "$APP_PATH"
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"], check=True, timeout=180)' "$UDID"
          xcrun simctl install "$UDID" "$APP_PATH"
          LAUNCH_RESULT="$(xcrun simctl launch "$UDID" com.cloudcode.ios)"
          echo "$LAUNCH_RESULT"
          PID="${LAUNCH_RESULT##*: }"
          test -n "$PID"
          sleep 8
          if ! xcrun simctl terminate "$UDID" com.cloudcode.ios; then
            echo 'FAIL: Cloud Code exited during simulator launch smoke test' >&2
            xcrun simctl spawn "$UDID" log show --last 30s --style compact --predicate 'process == "CloudCode"' || true
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            exit 1
          fi
          xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
          echo 'PASS: Cloud Code remained alive after simulator launch'

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          rm -rf build/DerivedData build/ipa
          xcodebuild \
            -project CloudCodeIOS.xcodeproj \
            -scheme CloudCodeIOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/CloudCode.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry ../CloudCode-iOS-unsigned.ipa Payload)

      - name: Verify IPA
        run: bash scripts/verify_ipa.sh build/CloudCode-iOS-unsigned.ipa

      - name: Verify installability guardrails reject broken IPA metadata
        run: bash scripts/test_verify_ipa_negative.sh build/CloudCode-iOS-unsigned.ipa

      - name: Static safety checks
        run: |
          set -euo pipefail
          if grep -R --line-number 'root_exec(' Sources; then
            echo "FAIL: unrestricted root_exec primitive found in Sources" >&2
            exit 1
          fi
          if grep -R --line-number 'removeItem(atPath: "/")' Sources; then
            echo "FAIL: direct filesystem-root deletion primitive found" >&2
            exit 1
          fi
          if grep -R -E --line-number 'sk-[A-Za-z0-9]{20,}' Sources Tests docs scripts .github; then
            echo "FAIL: API-Key-shaped material found in tracked source/test/docs/workflow files" >&2
            exit 1
          fi
          if grep -R -E --line-number 'uses: [^#]+@(v[0-9]+|main|master)([[:space:]]|$)' .github/workflows; then
            echo "FAIL: GitHub Action is not pinned to an immutable commit SHA" >&2
            exit 1
          fi
          grep -F 'revision: "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"' Package.swift >/dev/null
          grep -F 'revision: 22787ffb59de99e5dc1fbfe80b19c97a904ad48d' project.yml >/dev/null
          if grep -R --line-number 'NSAllowsArbitraryLoads' Sources project.yml Entitlements; then
            echo "FAIL: App Transport Security arbitrary loads must remain disabled" >&2
            exit 1
          fi
          if grep -F 'TrollStore.entitlements' project.yml; then
            echo "FAIL: public Runner build must not use TrollStore private entitlements" >&2
            exit 1
          fi
          grep -F 'CODE_SIGN_ENTITLEMENTS: Entitlements/CloudCode.entitlements' project.yml >/dev/null
          grep -F 'kSecAttrAccessibleWhenUnlockedThisDeviceOnly' Sources/CloudCodeCore/KeychainAPIKeyVault.swift >/dev/null
          if grep -F 'kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly' Sources/CloudCodeCore/KeychainAPIKeyVault.swift; then
            echo "FAIL: Provider Keys must not remain readable while the device is locked" >&2
            exit 1
          fi
          if grep -F 'record("data.keychain_scope", .data, .available' Sources/CloudCodeCore/CapabilityProbe.swift; then
            echo "FAIL: Keychain capability must be runtime-probed rather than hard-coded available" >&2
            exit 1
          fi
          grep -F 'probeOwnKeychain()' Sources/CloudCodeCore/CapabilityProbe.swift >/dev/null
          python3 - <<'PY'
          from pathlib import Path

          capability = Path('Sources/CloudCodeCore/CapabilityProbe.swift').read_text(encoding='utf-8')
          safe = capability.split('public func probeStartupSafe()', 1)[1].split('public func probeExtendedDevice()', 1)[0]
          for forbidden in ('URL(fileURLWithPath: "/var/mobile', 'unrestrictedFilesystemProbe(', 'hasDynamicSymbol(', 'rootHelperCapability()', 'installedApps()', 'probePrivileged(', 'probeOwnKeychain('):
              if forbidden in safe:
                  raise SystemExit(f'FAIL: startup-safe capability probe contains forbidden operation: {forbidden}')

          app = Path('Sources/CloudCodeApp/AppEnvironment.swift').read_text(encoding='utf-8')
          bootstrap = app.split('public func bootstrap()', 1)[1].split('public var isRunning', 1)[0]
          for forbidden in ('appResolver.forceRefresh()', 'capabilityProbe.probe()', 'capabilityProbe.probePrivileged()', 'capabilityProbe.probeExtendedDevice()'):
              if forbidden in bootstrap:
                  raise SystemExit(f'FAIL: automatic bootstrap contains privileged/full probe: {forbidden}')
          if 'capabilityProbe.probeStartupSafe()' not in bootstrap:
              raise SystemExit('FAIL: automatic bootstrap must use startup-safe capability probe')
          refresh = app.split('public func refreshCapabilities()', 1)[1].split('public func refreshFiles()', 1)[0]
          if 'guard capabilityRefreshTask == nil' not in refresh:
              raise SystemExit('FAIL: explicit capability refresh lost duplicate/concurrency guard')
          if 'capabilityProbe.probeExtendedDevice()' not in refresh or 'capabilityProbe.probePrivileged()' not in refresh:
              raise SystemExit('FAIL: explicit refresh must stage extended-device then privileged probing')
          if 'capabilities = extended' in refresh:
              raise SystemExit('FAIL: intermediate extended capability state must not be published before privileged validation completes')
          if 'extendedProbe.begin' not in refresh or 'extendedProbe.end' not in refresh or 'privilegedProbe.begin' not in refresh or 'privilegedProbe.end' not in refresh:
              raise SystemExit('FAIL: explicit capability refresh lost breadcrumb boundaries')

          agent = Path('Sources/CloudCodeCore/AgentCore.swift').read_text(encoding='utf-8')
          if 'await capabilityProbe.probeStartupSafe()' not in agent:
              raise SystemExit('FAIL: ordinary Agent run lost startup-safe capability probe')
          if agent.count('capabilityProbe.probePrivileged()') != 1 or 'if name == "capability.probe" { capabilities = await capabilityProbe.probePrivileged() }' not in agent:
              raise SystemExit('FAIL: privileged Agent probe must remain exclusive to explicit capability.probe tool execution')

          adapters = Path('Sources/CloudCodeApp/PlatformAdapters.swift').read_text(encoding='utf-8')
          resolver = adapters.split('public actor IOSAppResolver', 1)[1].split('@MainActor\npublic final class ApprovalCenter', 1)[0]
          for forbidden in ('LSApplicationWorkspace', 'MobileInstallation.framework', 'mobileInstallationUninstallSymbol', 'NSClassFromString', 'class_getInstanceMethod', 'class_getClassMethod', 'method_getImplementation', 'unsafeBitCast'):
              if forbidden in resolver:
                  raise SystemExit(f'FAIL: IOSAppResolver reintroduced main-process private ABI execution: {forbidden}')
          resolver_refresh = resolver.split('private func refresh()', 1)[1].split('private static func isUserApplicationBundlePath', 1)[0]
          if 'EmbeddedRootHelper.enumerateInstalledApps()' not in resolver_refresh:
              raise SystemExit('FAIL: installed-app refresh is no longer isolated in root helper')
          launch = resolver.split('public func launchApplication(bundleID:', 1)[1].split('public func terminateApplication', 1)[0]
          if 'EmbeddedRootHelper.launch(bundleID: bundleID)' not in launch:
              raise SystemExit('FAIL: app launch must execute through the isolated root helper')
          uninstall = resolver.split('public func uninstallApplication(bundleID:', 1)[1].split('private enum UninstallReconciliation', 1)[0]
          if 'EmbeddedRootHelper.uninstall(bundleID: bundleID' not in uninstall or 'EmbeddedRootHelper.installationState(bundleID: bundleID)' not in uninstall:
              raise SystemExit('FAIL: app uninstall and registration verification must execute through the isolated root helper')

          helper = Path('Sources/CloudCodeRootHelper/main.m')
          if not helper.exists():
              raise SystemExit('FAIL: CloudCodeRootHelper source is missing')
          helper_text = helper.read_text(encoding='utf-8')
          for marker in ('enumerate-json', 'probe-launch', 'probe-uninstall', 'is-installed', 'launch', 'uninstall'):
              if marker not in helper_text:
                  raise SystemExit(f'FAIL: root helper command missing: {marker}')
          bridge = Path('Sources/CloudCodeApp/RootHelperBridge.m').read_text(encoding='utf-8')
          if 'CLOUDCODE_HELPER_CAPTURE_LIMIT (1024 * 1024)' not in bridge or 'WIFSIGNALED(status)' not in bridge:
              raise SystemExit('FAIL: root helper bridge lost bounded output capture or signal isolation')

          app_entry = Path('Sources/CloudCodeApp/CloudCodeIOSApp.swift').read_text(encoding='utf-8')
          for marker in ('app.main.enter', 'firstScene.rendered'):
              if marker not in app_entry:
                  raise SystemExit(f'FAIL: startup breadcrumb marker missing: {marker}')
          for marker in ('viewModel.init.begin', 'viewModel.init.end', 'bootstrap.safe.begin', 'bootstrap.safe.end', 'bootstrap.recovery.begin', 'bootstrap.recovery.ready'):
              if marker not in app:
                  raise SystemExit(f'FAIL: startup breadcrumb marker missing: {marker}')
          if 'previousStartupCompleted' not in app or 'runContainsStage($0.runID, stage: "bootstrap.completed")' not in app:
              raise SystemExit('FAIL: crash-loop recovery no longer checks whether the previous startup reached the stable completion point')
          recovery = bootstrap.split('if previousStartupRun != nil && !previousStartupCompleted', 1)[1].split('isRefreshingCapabilities = true', 1)[0]
          for forbidden in ('probeStartupSafe()', 'probeExtendedDevice()', 'probePrivileged()', 'importBootstrapIfPresent()', 'hermesStore.bootstrap()', 'recoverInterruptedTransactions()', 'diagnosticLogStore.', 'refreshDiagnosticLogs('):
              if forbidden in recovery:
                  raise SystemExit(f'FAIL: startup recovery mode contains unsafe/nonessential work: {forbidden}')

          content = Path('Sources/CloudCodeApp/ContentView.swift').read_text(encoding='utf-8')
          root_tabs = content.split('private struct MoreView', 1)[0]
          if root_tabs.count('.tabItem { Label(') != 5:
              raise SystemExit('FAIL: iPhone root TabView must contain exactly five tabs to avoid UIKit automatic More remapping')
          for required in ('SettingsView(model: model)', 'MoreView(model: model)', '.tag(RootTab.settings)', '.tag(RootTab.more)'):
              if required not in root_tabs:
                  raise SystemExit(f'FAIL: stable root navigation marker missing: {required}')
          for forbidden in ('AppsView(model: model)', 'FilesView(model: model)', 'HermesVaultView(model: model)', 'ActivityView(model: model)', 'TrashView(model: model)'):
              if forbidden in root_tabs:
                  raise SystemExit(f'FAIL: overflow view leaked back into iPhone root TabView: {forbidden}')
          if 'showDiagnostics = true' not in content or 'Label("日志", systemImage: "doc.text.magnifyingglass")' not in content:
              raise SystemExit('FAIL: direct chat-to-diagnostics entry point is missing')

          provider_client = Path('Sources/CloudCodeCore/ProviderClient.swift').read_text(encoding='utf-8')
          for marker in ('providerPayload(from: line)', 'case "message":', 'case "message_delta":', 'case "response":'):
              if marker not in provider_client:
                  raise SystemExit(f'FAIL: provider proxy/non-SSE compatibility marker missing: {marker}')
          catalog = Path('Sources/CloudCodeCore/ProviderCatalog.swift').read_text(encoding='utf-8')
          agent_router = catalog.split('id: "https-agentrouter-org"', 1)[1].split('source: .desktopSnapshot', 1)[0]
          if 'authMode: .bearer' not in agent_router:
              raise SystemExit('FAIL: AgentRouter catalog auth mode drifted without live evidence')
          for marker in ('ProviderKeyProvisioner.apply(', 'manualProviderKeyOverrides', 'provider.key.save.begin', 'installedKeyReferences'):
              if marker not in app:
                  raise SystemExit(f'FAIL: hardened Provider Key replacement marker missing: {marker}')
          if 'private func importBootstrapIfPresent()' in app:
              raise SystemExit('FAIL: launch-time Provider bootstrap importer must not exist; Provider Keychain changes require explicit user action')
          for forbidden in ('keyVault.key(', 'keyVault.set(', 'ProviderKeyProvisioner.apply(', 'importProviderBootstrapNow(', 'refreshInstalledKeyReferences(', 'inferManualProviderKeyOverrides('):
              if forbidden in bootstrap:
                  raise SystemExit(f'FAIL: automatic bootstrap reintroduced Provider Keychain work: {forbidden}')
          if 'readAll(limit: 12_000)' in app:
              raise SystemExit('FAIL: diagnostics view reintroduced an unbounded/high-memory 12k record refresh')
          if 'while !Task.isCancelled' in content.split('private struct DiagnosticLogsView', 1)[1].split('private struct DiagnosticShareItem', 1)[0]:
              raise SystemExit('FAIL: diagnostics view reintroduced continuous full-refresh polling')
          if '复制闪退线索' not in content or 'crashRecoveryDiagnosticText' not in app:
              raise SystemExit('FAIL: lightweight crash-recovery diagnostics path is missing')
          print('PASS: startup-safe, provider-compatibility, hardened key replacement, diagnostics and settings-navigation guardrails are present')
          PY
          grep -F 'backgroundContinuationWindow: TimeInterval = 90 * 60' Sources/CloudCodeApp/AppEnvironment.swift >/dev/null
          grep -F 'type: library.static' project.yml >/dev/null
          if unzip -l build/CloudCode-iOS-unsigned.ipa | grep -F 'Payload/CloudCode.app/Frameworks/CloudCodeCore.framework/'; then
            echo "FAIL: CloudCodeCore must be statically linked for TrollStore launch reliability" >&2
            exit 1
          fi
          grep -F 'configuration.waitsForConnectivity = true' Sources/CloudCodeCore/ProviderClient.swift >/dev/null
          grep -F 'configuration.timeoutIntervalForResource = 90 * 60' Sources/CloudCodeCore/ProviderClient.swift >/dev/null
          grep -F 'ProviderError.streamInterrupted' Sources/CloudCodeCore/ProviderClient.swift >/dev/null
          if grep -F 'codesign --force --sign - --entitlements Entitlements/TrollStore.entitlements' .github/workflows/private-trollstore-ipa.yml; then
            echo "FAIL: stable private TrollStore workflow must not pre-sign with experimental privileged entitlements" >&2
            exit 1
          fi
          if find . -path './.git' -prune -o -type f \( -name 'CloudCode-Provider-Bootstrap.json' -o -name '*.provider-bootstrap.json' \) -print | grep -q .; then
            echo "FAIL: private Provider bootstrap exists in checkout" >&2
            exit 1
          fi
          if unzip -l build/CloudCode-iOS-unsigned.ipa | grep -E 'Provider-Bootstrap|GeneratedSecrets|/Secrets/'; then
            echo "FAIL: private bootstrap material was packaged into PUBLIC_UNSIGNED_IPA" >&2
            exit 1
          fi
          grep -R --line-number 'DEVICE_VALIDATION_REQUIRED\|deviceValidationRequired' Sources docs >/dev/null
          echo 'PUBLIC_UNSIGNED_IPA: no embedded Provider credentials detected'
          echo 'PRIVATE_KEY_BOOTSTRAP_REQUIRED: generate locally with scripts/generate_private_bootstrap.py'

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CloudCode-iOS-PUBLIC_UNSIGNED_IPA
          path: build/CloudCode-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload test/build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CloudCode-iOS-ci-diagnostics
          path: |
            .build/debug.yaml
            build/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7
