name: iOS CI and IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcode-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version | grep -F '2.46.0'

      - name: Resolve and test core package
        run: |
          set -euo pipefail
          swift package resolve
          swift test --parallel

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project CloudCodeIOS.xcodeproj \
            -scheme CloudCodeIOS \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          rm -rf build/DerivedData build/ipa
          xcodebuild \
            -project CloudCodeIOS.xcodeproj \
            -scheme CloudCodeIOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/CloudCode.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry ../CloudCode-iOS-unsigned.ipa Payload)

      - name: Verify IPA
        run: bash scripts/verify_ipa.sh build/CloudCode-iOS-unsigned.ipa

      - name: Static safety checks
        run: |
          set -euo pipefail
          if grep -R --line-number 'root_exec(' Sources; then
            echo "FAIL: unrestricted root_exec primitive found in Sources" >&2
            exit 1
          fi
          if grep -R --line-number 'removeItem(atPath: "/")' Sources; then
            echo "FAIL: direct filesystem-root deletion primitive found" >&2
            exit 1
          fi
          if grep -R -E --line-number 'sk-[A-Za-z0-9]{20,}' Sources Tests docs scripts .github; then
            echo "FAIL: API-Key-shaped material found in tracked source/test/docs/workflow files" >&2
            exit 1
          fi
          if grep -R -E --line-number 'uses: [^#]+@(v[0-9]+|main|master)([[:space:]]|$)' .github/workflows; then
            echo "FAIL: GitHub Action is not pinned to an immutable commit SHA" >&2
            exit 1
          fi
          grep -F 'revision: "22787ffb59de99e5dc1fbfe80b19c97a904ad48d"' Package.swift >/dev/null
          grep -F 'revision: 22787ffb59de99e5dc1fbfe80b19c97a904ad48d' project.yml >/dev/null
          if grep -R --line-number 'NSAllowsArbitraryLoads' Sources project.yml Entitlements; then
            echo "FAIL: App Transport Security arbitrary loads must remain disabled" >&2
            exit 1
          fi
          if grep -F 'TrollStore.entitlements' project.yml; then
            echo "FAIL: public Runner build must not use TrollStore private entitlements" >&2
            exit 1
          fi
          grep -F 'CODE_SIGN_ENTITLEMENTS: Entitlements/CloudCode.entitlements' project.yml >/dev/null
          grep -F 'kSecAttrAccessibleWhenUnlockedThisDeviceOnly' Sources/CloudCodeCore/KeychainAPIKeyVault.swift >/dev/null
          if grep -F 'kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly' Sources/CloudCodeCore/KeychainAPIKeyVault.swift; then
            echo "FAIL: Provider Keys must not remain readable while the device is locked" >&2
            exit 1
          fi
          if find . -path './.git' -prune -o -type f \( -name 'CloudCode-Provider-Bootstrap.json' -o -name '*.provider-bootstrap.json' \) -print | grep -q .; then
            echo "FAIL: private Provider bootstrap exists in checkout" >&2
            exit 1
          fi
          if unzip -l build/CloudCode-iOS-unsigned.ipa | grep -E 'Provider-Bootstrap|GeneratedSecrets|/Secrets/'; then
            echo "FAIL: private bootstrap material was packaged into PUBLIC_UNSIGNED_IPA" >&2
            exit 1
          fi
          grep -R --line-number 'DEVICE_VALIDATION_REQUIRED\|deviceValidationRequired' Sources docs >/dev/null
          echo 'PUBLIC_UNSIGNED_IPA: no embedded Provider credentials detected'
          echo 'PRIVATE_KEY_BOOTSTRAP_REQUIRED: generate locally with scripts/generate_private_bootstrap.py'

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CloudCode-iOS-PUBLIC_UNSIGNED_IPA
          path: build/CloudCode-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload test/build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CloudCode-iOS-ci-diagnostics
          path: |
            .build/debug.yaml
            build/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7
