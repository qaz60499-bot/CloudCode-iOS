name: CloudCodeIOS
options:
  bundleIdPrefix: com.cloudcode
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    revision: 22787ffb59de99e5dc1fbfe80b19c97a904ad48d
targets:
  CloudCodeCore:
    type: library.static
    platform: iOS
    sources:
      - Sources/CloudCodeCore
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudcode.ios.core
        PRODUCT_NAME: CloudCodeCore
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 32
        VERSIONING_SYSTEM: apple-generic
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        SKIP_INSTALL: YES
  CloudCodeIOS:
    type: application
    platform: iOS
    sources:
      - Sources/CloudCodeApp
    dependencies:
      - target: CloudCodeCore
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudcode.ios
        PRODUCT_NAME: CloudCode
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 32
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: 5.9
        SWIFT_OBJC_BRIDGING_HEADER: Sources/CloudCodeApp/RootHelperBridge.h
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cloud Code
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Cloud Code can attach a photo to a conversation only when the user grants access.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Cloud Code uses the microphone only while you are dictating a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Cloud Code converts your dictated speech into editable text before you send it.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Entitlements/CloudCode.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: Materialize App Icon
        script: |
          set -euo pipefail
          cd "$SRCROOT"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" xcrun --sdk macosx swift scripts/materialize_app_icon.swift
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Build Embedded Root Helper
        script: |
          set -euo pipefail
          if [ "$PLATFORM_NAME" != "iphoneos" ]; then
            exit 0
          fi
          HELPER="$TARGET_BUILD_DIR/$WRAPPER_NAME/CloudCodeRootHelper"
          xcrun --sdk iphoneos clang \
            -fobjc-arc \
            -fblocks \
            -fmodules \
            -target arm64-apple-ios16.0 \
            "$SRCROOT/Sources/CloudCodeRootHelper/main.m" \
            -framework Foundation \
            -o "$HELPER"
          chmod 0755 "$HELPER"
          INFO="$TARGET_BUILD_DIR/$WRAPPER_NAME/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :TSRootBinaries' "$INFO" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :TSRootBinaries array' "$INFO"
          /usr/libexec/PlistBuddy -c 'Add :TSRootBinaries:0 string CloudCodeRootHelper' "$INFO"
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - CloudCodeIOSUITests
  CloudCodeIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/CloudCodeCoreTests
    dependencies:
      - target: CloudCodeCore
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudcode.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
  CloudCodeIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/CloudCodeUITests
    dependencies:
      - target: CloudCodeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudcode.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
        TEST_TARGET_NAME: CloudCodeIOS
