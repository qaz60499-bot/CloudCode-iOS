name: CloudCodeIOS
options:
  bundleIdPrefix: com.cloudcode
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    revision: 22787ffb59de99e5dc1fbfe80b19c97a904ad48d
targets:
  CloudCodeCore:
    type: framework
    platform: iOS
    sources:
      - Sources/CloudCodeCore
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudcode.ios.core
        PRODUCT_NAME: CloudCodeCore
        MARKETING_VERSION: 1.0.5
        CURRENT_PROJECT_VERSION: 6
        VERSIONING_SYSTEM: apple-generic
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
        SKIP_INSTALL: YES
  CloudCodeIOS:
    type: application
    platform: iOS
    sources:
      - Sources/CloudCodeApp
    dependencies:
      - target: CloudCodeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudcode.ios
        PRODUCT_NAME: CloudCode
        MARKETING_VERSION: 1.0.5
        CURRENT_PROJECT_VERSION: 6
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cloud Code
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Cloud Code can attach a photo to a conversation only when the user grants access.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Cloud Code uses the microphone only while you are dictating a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Cloud Code converts your dictated speech into editable text before you send it.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Entitlements/CloudCode.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: Materialize App Icon
        script: |
          set -euo pipefail
          cd "$SRCROOT"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" xcrun --sdk macosx swift scripts/materialize_app_icon.swift
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - CloudCodeIOSTests
  CloudCodeIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/CloudCodeCoreTests
    dependencies:
      - target: CloudCodeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudcode.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
