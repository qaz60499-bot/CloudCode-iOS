name: ChatGPTWebCompat
options:
  bundleIdPrefix: com.cloudcode
  deploymentTarget:
    iOS: "16.6"
targets:
  ChatGPTWebCompat:
    type: application
    platform: iOS
    deploymentTarget: "16.6"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudcode.chatgptwebcompat
        PRODUCT_NAME: ChatGPTWebCompat
        MARKETING_VERSION: 1.0.3
        CURRENT_PROJECT_VERSION: 4
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ChatGPT Web
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
